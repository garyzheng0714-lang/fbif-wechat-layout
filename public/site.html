<header class="global-channel-bar">

  <div class="topbar-spacer"></div>

  <div class="tb-actions preview-toolbar" id="previewToolbar">

    <button class="btn btn-primary tb-primary" id="copyBtn" type="button" onclick="copyContent()">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>

  </div>

<script type="module">
import { pickActivePreset } from '/js/blocks/block-merge.js';
// ---- Version ----
async function loadVersionInfo() {
  try { const r = await fetch('/version.json?ts=' + Date.now(), { cache: 'no-store' }); if (r.ok) return await r.json(); } catch {}
  return { build: 'runtime-' + Date.now() };
}
const versionInfo = await loadVersionInfo();
const rawBuildId = String(versionInfo.build || versionInfo.commit || Date.now());
const isDevBuild = rawBuildId === 'dev';

function escText(value) {
  return String(value == null ? '' : value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

  const card = document.getElementById('activeRuleCard');
  if (!card) return;
  const preset = (window._activeConfig && window._activeConfig.preset) || {};

  const selectedID = activeRuleSelectorEditing ? (activeRuleSelectorDraftID || currentID) : currentID;
  const options = ruleSelectorOptions(preset);
  const selectedRule = options.find(rule => rule.id === selectedID) || options[0];
  const canSave = activeRuleSelectorEditing && selectedID && selectedID !== currentID;
  const statusHTML = activeRuleSelectorStatus ? `<div class="active-rule-status">${escText(activeRuleSelectorStatus)}</div>` : '';
  const ruleName = escText(selectedRule.name || selectedRule.id);
  const menuHTML = activeRuleSelectorEditing && activeRuleSelectorOpen ? `
        <div class="active-rule-menu" id="activeRuleMenu" role="listbox" aria-label="当前规则">
          ${options.map(rule => `
            <button type="button" class="active-rule-option" role="option" aria-selected="${rule.id === selectedID ? 'true' : 'false'}" data-rule-option="${escText(rule.id)}">
              <span class="active-rule-option-name">${escText(rule.name || rule.id)}</span>
              <span class="active-rule-option-check" aria-hidden="true">✓</span>
            </button>
          `).join('')}
        </div>
      ` : '';
  card.className = 'active-rule-card' + (activeRuleSelectorEditing ? ' editing' : '') + (activeRuleSelectorOpen ? ' menu-open' : '');
  card.innerHTML = activeRuleSelectorEditing ? `
    <div class="active-rule-caption">
      <span class="active-rule-label">当前规则</span>
      <span class="active-rule-badge">编辑中</span>
    </div>
    <div class="active-rule-line">
      <span class="active-rule-select-wrap">
        <button type="button" id="activeRuleSelect" class="active-rule-trigger" data-value="${escText(selectedRule.id)}" aria-haspopup="listbox" aria-expanded="${activeRuleSelectorOpen ? 'true' : 'false'}" ${activeRuleSelectorEditing ? '' : 'disabled'}>
          <span class="active-rule-value">${ruleName}</span>
        </button>
        <svg class="active-rule-chevron" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        ${menuHTML}
      </span>
      <button type="button" class="active-rule-save" data-action="save-active-rule" ${canSave ? '' : 'disabled'}>保存</button>
      <button type="button" class="active-rule-cancel" data-action="cancel-active-rule">取消</button>
    </div>
    ${statusHTML}
  ` : `
    <div class="active-rule-readline">
      <span class="active-rule-readmeta">
        <span class="active-rule-label">规则</span>
        <span class="active-rule-readvalue">${ruleName}</span>
        <span class="active-rule-badge">已锁定</span>
      </span>
      <button type="button" class="active-rule-icon" data-action="edit-active-rule" aria-label="修改当前规则" title="修改当前规则">
        <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M4 20h4l11-11a2.8 2.8 0 0 0-4-4L4 16v4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M13.5 6.5l4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </div>
    ${statusHTML}
  `;
  const trigger = card.querySelector('#activeRuleSelect');
  if (trigger) {
    trigger.addEventListener('click', () => toggleActiveRuleMenu());
    trigger.addEventListener('keydown', event => {
      if (!activeRuleSelectorEditing) return;
      if (event.key === 'Enter' || event.key === ' ' || event.key === 'ArrowDown') {
        event.preventDefault();
        activeRuleSelectorOpen = true;
        activeRuleSelectorStatus = '';
        renderActiveRuleCard();
      }
      if (event.key === 'Escape') {
        activeRuleSelectorOpen = false;
        renderActiveRuleCard();
      }
    });
  }
  card.querySelectorAll('[data-rule-option]').forEach(button => {
    button.addEventListener('click', () => chooseActiveRuleOption(button.getAttribute('data-rule-option')));
    button.addEventListener('keydown', event => handleActiveRuleOptionKeydown(event, button));
  });
  const editButton = card.querySelector('[data-action="edit-active-rule"]');
  if (editButton) editButton.addEventListener('click', () => beginActiveRuleEdit());

async function loadRuleCatalog() {
  try {
    const data = await listPublicRulePresets();
    return { presets: Array.isArray(data.presets) ? data.presets : [] };
  } catch {
    const preset = (window._activeConfig && window._activeConfig.preset) || {};
    return { presets: preset.id ? [{ id: preset.id, name: preset.name || preset.id }] : [] };
  }
}

async function refreshActiveRuleCatalog(accountID = activeRulePack.id) {
  const catalog = await loadRuleCatalog();
  if (accountID !== activeRulePack.id) return catalog;
  activeRuleCatalog = catalog;
  renderActiveRuleCard();
  return catalog;
}

function ruleSelectorOptions(currentPreset) {
  const seen = new Set();
  const rules = [];
  for (const rule of activeRuleCatalog.presets || []) {
    if (!rule || !rule.id || seen.has(rule.id)) continue;
    seen.add(rule.id);
    rules.push({ id: rule.id, name: rule.name || rule.id });
  }
  if (currentPreset && currentPreset.id && !seen.has(currentPreset.id)) {
    rules.unshift({ id: currentPreset.id, name: currentPreset.name || currentPreset.id });
  }
  return rules.length ? rules : [{ id: 'default', name: '默认规则' }];
}

function clearActiveRuleOutsideHandler() {
  if (!activeRuleOutsideHandler) return;
  document.removeEventListener('pointerdown', activeRuleOutsideHandler);
  activeRuleOutsideHandler = null;
}

function syncActiveRuleOutsideHandler(card) {
  clearActiveRuleOutsideHandler();
  if (!activeRuleSelectorOpen) return;
  activeRuleOutsideHandler = event => {
    if (card.contains(event.target)) return;
    activeRuleSelectorOpen = false;
    renderActiveRuleCard();
  };
  setTimeout(() => document.addEventListener('pointerdown', activeRuleOutsideHandler), 0);
}

function toggleActiveRuleMenu() {
  if (!activeRuleSelectorEditing) return;
  activeRuleSelectorOpen = !activeRuleSelectorOpen;
  activeRuleSelectorStatus = '';
  renderActiveRuleCard();
}

function chooseActiveRuleOption(ruleID) {
  if (!ruleID) return;
  activeRuleSelectorDraftID = ruleID;
  activeRuleSelectorOpen = false;
  activeRuleSelectorStatus = '';
  renderActiveRuleCard();
}

function handleActiveRuleOptionKeydown(event, currentButton) {
  const options = Array.from(document.querySelectorAll('[data-rule-option]'));
  const index = options.indexOf(currentButton);
  if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
    event.preventDefault();
    const direction = event.key === 'ArrowDown' ? 1 : -1;
    const next = options[(index + direction + options.length) % options.length];
    if (next) next.focus();
  }
  if (event.key === 'Enter' || event.key === ' ') {
    event.preventDefault();
    chooseActiveRuleOption(currentButton.getAttribute('data-rule-option'));
  }
  if (event.key === 'Escape') {
    event.preventDefault();
    activeRuleSelectorOpen = false;
    renderActiveRuleCard();
    const trigger = document.getElementById('activeRuleSelect');
    if (trigger) trigger.focus();
  }
}

async function hydrateActiveRulePreset(accountID = activeRulePack.id) {
  const loaded = await loadActiveRulePreset(accountID);
  if (accountID !== activeRulePack.id) return loaded;
  activeRuleSource = loaded.source;
  applyActiveRuleConfig(loaded.preset.config, loaded.preset);
  if (activeRuleSource === 'server') cacheServerRuleFallback(loaded.preset.config);
  activeRuleSelectorDraftID = loaded.preset.id || 'default';
  activeRuleSelectorStatus = '';
  refreshRuleConsumers({ rerender: true });
  return loaded;
}

async function saveActiveRuleSelection() {
  const preset = (window._activeConfig && window._activeConfig.preset) || {};
  const nextID = activeRuleSelectorDraftID || preset.id || 'default';
  if (nextID === preset.id) {
    activeRuleSelectorEditing = false;
    activeRuleSelectorOpen = false;
    renderActiveRuleCard();
    return;
  }
  activeRuleSelectorStatus = '保存中...';
  activeRuleSelectorOpen = false;
  renderActiveRuleCard();
  try {
    const password = await ensureRuleAdminPassword();
    await setActiveRulePreset(password, nextID, activeRulePack.id);
    const [loaded, catalog] = await Promise.all([
      loadActiveRulePreset(activeRulePack.id),
      loadRuleCatalog(),
    ]);
    activeRuleSource = loaded.source;
    applyActiveRuleConfig(loaded.preset.config, loaded.preset);
    if (activeRuleSource === 'server') cacheServerRuleFallback(loaded.preset.config);
    activeRuleCatalog = catalog;
    activeRuleSelectorEditing = false;
    activeRuleSelectorOpen = false;
    activeRuleSelectorDraftID = loaded.preset.id || nextID;
    activeRuleSelectorStatus = '已保存';
    refreshRuleConsumers({ rerender: true });
  } catch (err) {
    if (/password|密码|401|unauthorized/i.test(String(err && err.message))) activeRuleAdminPassword = '';
    activeRuleSelectorStatus = err.message || '保存失败';
    renderActiveRuleCard();
  }
}

// 从服务端激活规则取页脚库【内容】（segments html_lines / presets / segment_order）。
// 绕过 normalizeRuleConfig——它只重建已知 module（theme/supporting/...），会丢弃结构化的
// fbif_footer。无服务端内容时返回空对象，由 buildFooterHtml 降级到 footer-segments-defaults。
function serverRuleModules() {
  const ac = window._activeConfig || {};
  let cfg = (ac.preset && (ac.preset.raw_config || ac.preset.config)) || ac.config || {};
  if (cfg && cfg.config && cfg.config.modules) cfg = cfg.config; // 兼容 schema_version 2 嵌套
  return (cfg && cfg.modules && typeof cfg.modules === 'object') ? cfg.modules : {};
}

function serverFooterLibrary() {
  const mods = serverRuleModules();
  return (mods.fbif_footer && typeof mods.fbif_footer === 'object') ? mods.fbif_footer : {};
}

function serverAssetLibrary() {
  const mods = serverRuleModules();
  return (mods.asset_library && typeof mods.asset_library === 'object') ? mods.asset_library : {};
}

const FT_FOOTER_STORAGE = Object.freeze({
  enabled: 'ft.footer.enabled',
  segments: 'ft.footer.segments',
  order: 'ft.footer.order',
  signature: 'ft.footer.signature',
});
const FT_FOOTER_LABELS_DEFAULT = Object.freeze({
  tip: '提示声明',
  biz_coop: '商务合作',
  join_group: '加入微信群（二维码）',
  follow_account: '关注公众号（二维码）',
  logo: 'FoodTalks logo',
  more_info: '点击获取更多',
});
const FT_FOOTER_LABELS_SERIES = Object.freeze({
  ...FT_FOOTER_LABELS_DEFAULT,
  biz_coop: '什么是系列商务合作',
  bd_card: 'BD 名片',
  coop_table: '相关合作表',
  join_group: '加入FBIF饮料群（二维码）',

function footerSegmentLabel(key) {

    ? FT_FOOTER_LABELS_SERIES
    : FT_FOOTER_LABELS_DEFAULT;
  return labels[key] || key;
}
const FT_FOOTER_BD_CARD_RE = /^ftss_bd_[a-z0-9_-]+$/i;
const FT_FOOTER_FALLBACK_PRESETS = Object.freeze([
  Object.freeze({ id: 'fbif-original', name: 'FBIF原创', segments: Object.freeze({ tip: 1, biz_coop: 1, join_group: 1, follow_account: 1, logo: 1, more_info: 1 }) }),
  Object.freeze({ id: 'repost-simple', name: '转载简版', segments: Object.freeze({ tip: 1, biz_coop: 1, join_group: 0, follow_account: 0, logo: 0, more_info: 0 }) }),
  Object.freeze({ id: 'tip-only', name: '仅提示', segments: Object.freeze({ tip: 1, biz_coop: 0, join_group: 0, follow_account: 0, logo: 0, more_info: 0 }) }),
  Object.freeze({ id: 'none', name: '无', segments: Object.freeze({ tip: 0, biz_coop: 0, join_group: 0, follow_account: 0, logo: 0, more_info: 0 }) }),
]);
let footerBdCardAssetID = '';
let footerLastArticlePayload = null;
let refreshFooterControls = () => {};

function footerAssets(assetLibrary = serverAssetLibrary()) {
  return assetLibrary && Array.isArray(assetLibrary.assets) ? assetLibrary.assets : [];
}

function isFooterBdCardAsset(asset) {
  if (!asset || !asset.url) return false;
  const id = String(asset.id || '').trim();
  const tags = Array.isArray(asset.tags) ? asset.tags.map(tag => String(tag || '').trim()) : [];
  return FT_FOOTER_BD_CARD_RE.test(id) || tags.some(tag => /^BD\s*名片$/i.test(tag));
}

function footerBdCardAssets() {
  if (!activeRulePack || activeRulePack.id !== 'ft-series') return [];
  return footerAssets().filter(isFooterBdCardAsset);
}

function footerAssetByID(id) {
  if (!id) return null;
  return footerAssets().find(asset => String(asset && asset.id || '') === String(id)) || null;
}

function footerPresetList(footerLib = serverFooterLibrary()) {
  return Array.isArray(footerLib.presets) && footerLib.presets.length ? footerLib.presets : FT_FOOTER_FALLBACK_PRESETS;
}

function footerServerOrder(footerLib = serverFooterLibrary()) {
  return Array.isArray(footerLib.segment_order) && footerLib.segment_order.length
    ? footerLib.segment_order.filter(k => k !== 'tip')
    : ['biz_coop', 'join_group', 'follow_account', 'logo', 'more_info'];
}

function activeFooterPreset(footerLib = serverFooterLibrary()) {
  const presets = footerPresetList(footerLib);
  return presets.find(p => p.id === footerLib.active_preset_id) || presets[0] || { segments: {} };
}

function replaceBdCardAssetRef(lines, assetID) {
  if (!assetID) return lines;
  const nextRef = '{{asset#' + assetID + '}}';
  return (lines || []).map(line => String(line || '').replace(/\{\{asset#[a-z0-9_-]+\}\}/i, nextRef));
}

function footerDefaultBdCardAssetID(footerLib = serverFooterLibrary()) {
  const segments = footerLib && footerLib.segments && typeof footerLib.segments === 'object' ? footerLib.segments : null;
  const entry = segments && segments.bd_card;
  const htmlLines = Array.isArray(entry) ? entry : (entry && Array.isArray(entry.html_lines) ? entry.html_lines : []);
  const line = htmlLines.map(v => String(v || '')).find(v => /\{\{asset#[a-z0-9_-]+\}\}/i.test(v)) || '';
  const match = line.match(/\{\{asset#([a-z0-9_-]+)\}\}/i);
  return match ? match[1] : '';
}

function footerSelectedBdCardAsset() {
  return footerAssetByID(footerBdCardAssetID) || footerAssetByID(footerDefaultBdCardAssetID());
}

function applyFooterArticleOverrides(footerLib) {
  if (!footerBdCardAssetID || !footerLib || typeof footerLib !== 'object') return footerLib;
  const segments = footerLib.segments && typeof footerLib.segments === 'object' ? footerLib.segments : null;
  const entry = segments && segments.bd_card;
  const htmlLines = Array.isArray(entry) ? entry : (entry && Array.isArray(entry.html_lines) ? entry.html_lines : null);
  if (!htmlLines) return footerLib;
  return {
    ...footerLib,
    segments: {
      ...segments,
      bd_card: Array.isArray(entry)
        ? replaceBdCardAssetRef(entry, footerBdCardAssetID)
        : { ...entry, html_lines: replaceBdCardAssetRef(htmlLines, footerBdCardAssetID) },
    },
  };
}

function clearFooterArticleOverrides(rerender = false, resetPayload = true) {
  if (resetPayload) footerLastArticlePayload = null;
  if (!footerBdCardAssetID) return false;
  footerBdCardAssetID = '';
  refreshFooterControls();
  if (rerender) syncEngineConfig(true);
  return true;
}

function resetFooterArticleOverridesFor(session) {
  const input = session && session.input;
  const payload = input && (input.payload || input.title || null);
  if (!payload || payload === footerLastArticlePayload) return false;
  footerLastArticlePayload = payload;
  return clearFooterArticleOverrides(true, false);
}

function footerSignature(footerLib = serverFooterLibrary()) {
  const active = activeFooterPreset(footerLib);
  const segmentKeys = Object.keys((footerLib && footerLib.segments) || {}).sort();
  return JSON.stringify({
    preset: (footerLib && footerLib.active_preset_id) || active.id || '',
    order: footerServerOrder(footerLib),
    segments: active.segments || {},
    keys: segmentKeys,
  });
}

function readFooterState() {
  const footerLib = serverFooterLibrary();
  const signature = footerSignature(footerLib);
  const active = activeFooterPreset(footerLib);
  const defaultOrder = ['tip', ...footerServerOrder(footerLib)];
  const defaultSegments = { ...((active && active.segments) || {}) };
  const defaultEnabled = !!(footerLib && footerLib.enabled);
  const storedSignature = localStorage.getItem(FT_FOOTER_STORAGE.signature);
  const resetToServer = storedSignature !== signature;

  let order = [];
  let segments = {};
  let enabled = defaultEnabled;
  if (!resetToServer) {
    try { order = JSON.parse(localStorage.getItem(FT_FOOTER_STORAGE.order) || '[]'); } catch (e) {}
    try { segments = JSON.parse(localStorage.getItem(FT_FOOTER_STORAGE.segments) || 'null') || {}; } catch (e) {}
    const enabledLS = localStorage.getItem(FT_FOOTER_STORAGE.enabled);
    enabled = enabledLS === null ? defaultEnabled : enabledLS === '1';
  }

  const known = new Set(defaultOrder);
  order = Array.isArray(order) && order.length ? order.filter(k => known.has(k)) : [];
  for (const key of defaultOrder) {
    if (!order.includes(key)) order.push(key);
    if (!Object.prototype.hasOwnProperty.call(segments, key) && Object.prototype.hasOwnProperty.call(defaultSegments, key)) {
      segments[key] = defaultSegments[key];
    }
  }
  if (resetToServer || !Object.keys(segments).length) {
    segments = { ...defaultSegments };
    order = defaultOrder.slice();
  }

  localStorage.setItem(FT_FOOTER_STORAGE.signature, signature);
  localStorage.setItem(FT_FOOTER_STORAGE.enabled, enabled ? '1' : '0');
  localStorage.setItem(FT_FOOTER_STORAGE.segments, JSON.stringify(segments));
  localStorage.setItem(FT_FOOTER_STORAGE.order, JSON.stringify(order));
  return { footerLib, enabled, segments, order, presets: footerPresetList(footerLib) };
}

// 把当前规则（扁平参数 + 行为 + 模块开关）注入排版引擎的渲染配置。
// 命门：扁平参数（muted_color 等）必须并进去，否则网站模板读不到，
// 后台改颜色不生效（见 specs/2026-05-28-unified-rule-engine-design.md §3）。
function syncEngineConfig(triggerRerender) {
  if (!window._engineApi || !window._engineApi.setActiveConfig) return;
  const flat = loadConfig();
  const prev = (window._engineApi.getActiveConfig && window._engineApi.getActiveConfig()) || {};
  const prevModules = prev.modules || {};
  const serverBehavior = (window._activeConfig && window._activeConfig.behavior) || {};
  // 页脚库【内容】（segments html_lines / presets / segment_order）以服务端 /api/rules
  // 为准——直接从 raw _activeConfig.config 取，绕过 normalizeRuleConfig（它只认已知
  // module、会丢弃结构化的 fbif_footer）。服务端无内容时由 buildFooterHtml 降级默认。
  const footerState = readFooterState();
  const serverFooter = footerState.footerLib;
  const footerEnabled = footerState.enabled;
  const footerActiveSegments = footerState.segments;
  const footerOrder = footerState.order;
  const serverAssets = serverAssetLibrary();
  const serverBottomBlocks = serverRuleModules().bottom_blocks;
  const baseFooterForRender = Array.isArray(footerOrder) && footerOrder.length
    ? { ...serverFooter, segment_order: footerOrder.filter(k => k !== 'tip') }
    : serverFooter;
  const footerForRender = applyFooterArticleOverrides(baseFooterForRender);
  // 统一区块模型：把现有 ft.footer.* 单篇信号映射成 bottom_blocks 覆盖（开关/排序/逐块启用）。
  // 逐块 enabled = !!active_segments[id]（缺失视为关），与旧 buildFooterHtml 的 `if(!seg[key])continue` 一致。
  let bottomBlocksOverride;
  if (serverBottomBlocks && typeof serverBottomBlocks === 'object') {
    // v2：order 在 active preset 内（复用 block-merge 的 pickActivePreset 选预设）。
    const bbActive = pickActivePreset(serverBottomBlocks);
    const bbOrder = Array.isArray(bbActive.order) ? bbActive.order : [];
    const overrides = {};
    for (const id of bbOrder) {
      if (id === 'tip') continue;
      overrides[id] = { enabled: !!footerActiveSegments[id] };
    }
    bottomBlocksOverride = { enabled: footerEnabled, overrides };
    if (Array.isArray(footerOrder) && footerOrder.length) {
      bottomBlocksOverride.order = footerOrder.filter(k => k !== 'tip');
    }
  }
  const cfg = {
    ...flat,
    behavior: serverBehavior,
    _bottomBlocksOverride: bottomBlocksOverride,
    modules: {
      ...prevModules,
      fbif_footer: { ...footerForRender, enabled: footerEnabled, active_segments: footerActiveSegments },
      asset_library: serverAssets,
      ...(serverBottomBlocks && typeof serverBottomBlocks === 'object' ? { bottom_blocks: serverBottomBlocks } : {}),
      // 网站渠道 h2 默认不输出 mctoc 锚点 id —— FoodTalks 后台生成目录时会自己加
      // （用户 2026-05-30 确认），基石 news/62285 的 h2 也不带 id。默认关，避免与后台冲突。
      mctoc: prevModules.mctoc || { enabled: false },
    },
  };
  window._engineApi.setActiveConfig(cfg);
  if (triggerRerender && typeof window._engineApi.rerender === 'function') {
    window._engineApi.rerender();
  }
}

function cacheServerRuleFallback(config) {
  saveLocalRuleConfig(config, activeRulePack.id);
}

function saveConfig(config, preset, options = {}) {
  const normalized = normalizeRuleConfig(config);
  if (options.persistLocal || activeRuleSource !== 'server') {
    saveLocalRuleConfig(normalized, activeRulePack.id);
  }
  applyActiveRuleConfig(normalized, preset || (window._activeConfig && window._activeConfig.preset));
  refreshRuleConsumers();
  return normalized;
}

function syncWorkflowControls() {
  const c = loadConfig();
  const footerEl = document.getElementById('footerEnabled');
  if (footerEl) footerEl.checked = c.footer_enabled === true;

}

  shareQrCaption: '微信扫一扫',

function renderFoodTalksPreviewMeta(meta) {

{
  const shareButton = document.getElementById('ftShareButton');
  const sharePopover = document.getElementById('ftSharePopover');
  const shareCopyButton = document.getElementById('ftShareCopyText');
  function setShareOpen(open) {
    if (!shareButton || !sharePopover) return;
    shareButton.setAttribute('aria-expanded', open ? 'true' : 'false');
    sharePopover.hidden = !open;
  }
  if (shareButton && sharePopover) {
    shareButton.addEventListener('click', event => {
      event.stopPropagation();
      setShareOpen(sharePopover.hidden);
    });
    sharePopover.addEventListener('click', event => event.stopPropagation());
    document.addEventListener('click', () => setShareOpen(false));
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape') setShareOpen(false);
    });
  }
  if (shareCopyButton) {
    shareCopyButton.addEventListener('click', async () => {
      const text = window._currentArticleUrl || location.href;
      try {
        await navigator.clipboard.writeText(text);
        shareCopyButton.textContent = '已复制';
        window.setTimeout(() => { shareCopyButton.textContent = FOODTALKS_PREVIEW_META.shareCopyText; }, 1200);
      } catch {
        shareCopyButton.textContent = FOODTALKS_PREVIEW_META.shareCopyText;
      }
    });
  }
}

(() => {
  const toggle = document.getElementById('footerEnableToggle'), presetsEl = document.getElementById('footerPresets'), segsEl = document.getElementById('footerSegments');
  if (!toggle || !presetsEl || !segsEl) return;
  const state = readFooterState();
  const presetList = state.presets;
  const PRESETS = Object.fromEntries(presetList.map(p => [p.id, p.segments || {}]));
  let order = state.order;
  let enabled = state.enabled;
  let segments = state.segments;

  function bdCardSelectHtml(key) {
    if (key !== 'bd_card') return '';
    const assets = footerBdCardAssets();
    if (footerBdCardAssetID && !assets.some(asset => asset.id === footerBdCardAssetID)) footerBdCardAssetID = '';
    if (!assets.length) return '';
    return `<div class="ft-footer-bd-control">
      <select class="ft-footer-bd-select" data-bd-card-select aria-label="选择 BD 名片">
        <option value="" ${footerBdCardAssetID ? '' : 'selected'}>按规则默认</option>
        ${assets.map(asset => `<option value="${escText(asset.id)}" ${asset.id === footerBdCardAssetID ? 'selected' : ''}>${escText(asset.label || asset.id)}</option>`).join('')}
      </select>
      <div class="ft-footer-bd-preview" data-bd-card-preview hidden></div>
    </div>`;
  }

  function segmentRowHtml(key) {
    return `<div class="ft-footer-seg-row" data-seg-row="${escText(key)}" draggable="${key === 'tip' ? 'false' : 'true'}">
      <label class="ft-footer-seg-label">
        <input type="checkbox" data-seg="${escText(key)}">
        <span class="ft-footer-seg-title">${escText(footerSegmentLabel(key))}</span>
      </label>
      ${bdCardSelectHtml(key)}
    </div>`;
  }

  function renderControls() {
    presetsEl.innerHTML = presetList.map(p => `<button type="button" class="ft-footer-preset" data-preset="${escText(p.id)}">${escText(p.name || p.id)}</button>`).join('');
    segsEl.innerHTML = order.map(segmentRowHtml).join('');
  }
  renderControls();
  refreshFooterControls = () => { renderControls(); paint(); };

  const checkboxes = () => Array.from(segsEl.querySelectorAll('input[type="checkbox"]'));
  const segmentKeys = () => order.slice();
  function isEmptyFooterPreset(segs) {
    return segmentKeys().every(k => !segs || !segs[k]);
  }
  function matchPreset() {
    if (!enabled && PRESETS.none && isEmptyFooterPreset(PRESETS.none)) return 'none';
    for (const [id, segs] of Object.entries(PRESETS)) if (segmentKeys().every(k => !!segments[k] === !!segs[k])) return id;
    return null;
  }
  function paint() {
    toggle.checked = enabled;
    segsEl.classList.toggle('ft-footer-disabled', !enabled);
    const active = matchPreset();
    presetsEl.querySelectorAll('.ft-footer-preset').forEach(b => b.classList.toggle('active', b.dataset.preset === active));
    checkboxes().forEach(cb => { cb.checked = !!segments[cb.dataset.seg]; });
    const bdSelect = segsEl.querySelector('[data-bd-card-select]');
    if (bdSelect) {
      bdSelect.value = footerBdCardAssetID;
      bdSelect.disabled = !enabled || !segments.bd_card;
    }
    const bdPreview = segsEl.querySelector('[data-bd-card-preview]');
    const bdAsset = footerSelectedBdCardAsset();
    if (bdPreview) {
      if (bdAsset && bdAsset.url) {
        bdPreview.innerHTML = `<img src="${escText(bdAsset.url)}" alt="${escText(bdAsset.label || 'BD名片预览')}" loading="lazy">`;
        bdPreview.hidden = false;
        bdPreview.classList.toggle('disabled', !enabled || !segments.bd_card);
      } else {
        bdPreview.innerHTML = '';
        bdPreview.hidden = true;
      }
    }
  }
  function persist(rerender) { localStorage.setItem(FT_FOOTER_STORAGE.enabled, enabled ? '1' : '0'); localStorage.setItem(FT_FOOTER_STORAGE.segments, JSON.stringify(segments)); localStorage.setItem(FT_FOOTER_STORAGE.order, JSON.stringify(order)); syncEngineConfig(rerender); }

  paint();
  syncEngineConfig(false);

  toggle.addEventListener('change', () => {
    enabled = toggle.checked;
    if (enabled && !segmentKeys().some(k => segments[k])) segments = { ...((activeFooterPreset(serverFooterLibrary()) || {}).segments || {}) };
    paint(); persist(true);
  });
  presetsEl.addEventListener('click', e => {
    const btn = e.target.closest('.ft-footer-preset');
    if (!btn) return;
    const nextSegments = { ...(PRESETS[btn.dataset.preset] || {}) };
    enabled = !isEmptyFooterPreset(nextSegments);
    segments = nextSegments;
    paint(); persist(true);
  });
  segsEl.addEventListener('change', (e) => {
    const bdSelect = e.target.closest('[data-bd-card-select]');
    if (bdSelect) {
      footerBdCardAssetID = bdSelect.value || '';
      if (footerBdCardAssetID) {
        enabled = true;
        segments.bd_card = 1;
      }
      paint(); persist(true);
      return;
    }
    const cb = e.target.closest('input[type="checkbox"]');
    if (!cb) return;
    segments[cb.dataset.seg] = cb.checked ? 1 : 0;
    paint(); persist(true);
  });
  let dragging = '';
  segsEl.addEventListener('dragstart', e => { const row = e.target.closest('[data-seg-row]'); dragging = row && row.dataset.segRow || ''; });
  segsEl.addEventListener('dragover', e => { if (dragging && e.target.closest('[data-seg-row]')) e.preventDefault(); });
  segsEl.addEventListener('drop', e => {
    const row = e.target.closest('[data-seg-row]');
    if (!row || !dragging || dragging === row.dataset.segRow) return;
    e.preventDefault();
    const from = order.indexOf(dragging), to = order.indexOf(row.dataset.segRow);
    if (from >= 0 && to >= 0) order.splice(to, 0, order.splice(from, 1)[0]);
    renderControls(); paint(); persist(true);
  });
})();
