<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FoodTalks 网站排版工具</title>
<link rel="icon" type="image/svg+xml" href="/foodtalks-logo.svg">
<script src="/vendor/jszip.min.js"></script>
<script src="/vendor/gsap.min.js"></script>
<script src="/vendor/Flip.min.js"></script>
<script src="/vendor/wangeditor/index.js"></script>
<link rel="stylesheet" href="/vendor/wangeditor/style.css">
<link rel="stylesheet" href="/css/feishu-tokens.css">
<link rel="stylesheet" href="/app.css">
<link rel="stylesheet" href="/css/channel-bar.css">
<link rel="stylesheet" href="/admin-panel.css">
<link rel="stylesheet" href="/css/rule-admin.css">
<link rel="stylesheet" href="/css/app-shell.css">
<link rel="stylesheet" href="/css/wx-theme.css">
<link rel="stylesheet" href="/site.css">
</head>
<body>

<header class="global-channel-bar">
  <div class="acct-menu" id="acctMenu" aria-label="切换账号"></div>

  <div class="topbar-spacer"></div>

  <div class="tb-actions preview-toolbar" id="previewToolbar">
    <button class="tb-retry" id="retryBtn" type="button" style="display:none;" onclick="window.retryUpload && window.retryUpload()">重试上传</button>
    <button class="btn btn-secondary" id="adminLockBtn" type="button" title="规则后台" aria-label="规则后台">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 21v-7"/><path d="M4 10V3"/><path d="M12 21v-9"/><path d="M12 8V3"/><path d="M20 21v-5"/><path d="M20 12V3"/><path d="M1 14h6"/><path d="M9 8h6"/><path d="M17 16h6"/></svg>
      <span>规则</span>
    </button>
    <div class="copy-split" id="copySplit">
      <button class="btn btn-primary tb-primary copy-split-primary" id="copyBtn" type="button" onclick="copyContent()">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        <span data-copy-label>复制全文</span>
      </button>
      <button class="copy-split-toggle" id="copyMenuBtn" type="button" aria-label="更多复制选项" aria-haspopup="menu" aria-expanded="false" aria-controls="copyMenu">
        <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 7.5 5 5 5-5"/></svg>
      </button>
      <div class="copy-split-menu" id="copyMenu" role="menu" aria-label="复制格式" hidden>
        <button class="copy-split-menu-item" id="copyHtmlBtn" type="button" role="menuitem">
          <span>复制 HTML</span>
          <span class="copy-split-menu-meta" aria-hidden="true">&lt;/&gt;</span>
        </button>
      </div>
    </div>
  </div>
</header>

<div class="app-layout">
  <!-- ======== Sidebar ======== -->
  <aside class="rail sidebar sidebar-site" id="rail" data-screen-label="左栏">
    <div class="rail-body sidebar-body scroll-y">
      <!-- Hidden compat for engine.js -->
      <span id="pageTitle" style="display:none;"></span>
      <span id="pageSubtitle" style="display:none;"></span>

      <div class="import-zone" id="importZone">
        <div class="import-card">
          <div class="import-card-head">
            <div>
              <div class="import-title">导入内容</div>
            </div>
          </div>
          <div class="site-import-summary" id="siteImportSummary" role="button" tabindex="0" aria-label="展开导入内容" hidden>
            <span class="site-import-summary-label" id="siteImportSummaryLabel">已导入</span>
            <span class="site-import-summary-text" id="siteImportSummaryText">等待内容</span>
          </div>
          <div class="import-actions">
            <div class="dropzone upload-zone" id="dropZone" tabindex="0" role="button" aria-label="粘贴或拖拽文件到这里上传，点击添加本地文件">
              <div class="dropzone-inner">
                <div class="dropzone-empty" data-upload-empty>
                  <svg class="dropzone-cloud" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M22 46H17.5C10.6 46 6 41.4 6 35.5C6 30.1 10 25.8 15.3 25.1C17.5 15.3 25.2 9 34.3 9C44.5 9 52.5 17 52.8 27.1C58 28.7 61 32.7 61 37.7C61 43.2 56.5 46 50.6 46H44"/>
                    <path d="M33 55V32"/>
                    <path d="M23.5 41.5L33 32L42.5 41.5"/>
                  </svg>
                  <div class="dropzone-title upload-text" data-upload-label>粘贴或拖拽至这里上传</div>
                </div>
                <div class="dropzone-file" data-uploaded-file hidden>
                  <div class="dropzone-file-icon" data-file-ext>T</div>
                  <div class="dropzone-file-overlay">
                    <span class="dropzone-file-name" data-uploaded-name></span>
                    <button class="dropzone-file-remove" type="button" data-remove-upload aria-label="移除已选择文件">×</button>
                  </div>
                </div>
              </div>
              <div class="dropzone-add-row"><span aria-hidden="true">＋</span><span data-add-file-text>添加本地文件</span></div>
              <input type="file" id="fileInput">
            </div>
          </div>
          <div class="url-row url-row-inline import-composer" data-url-focus-target>
            <div class="import-input-stack">
              <label class="import-input-label" for="urlInput">正文 / 链接</label>
              <textarea id="urlInput" class="field url-input-inline import-textarea" rows="5" spellcheck="false" placeholder="粘贴 FoodTalks 链接、正文或 Markdown。系统会自动识别输入类型，并按当前账号规则排版。"></textarea>
            </div>
          </div>
          <div class="progress import-progress" id="progress">
            <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
            <div class="progress-text" id="progressText">正在排版...</div>
          </div>
        </div>
      </div>
      <div class="error" id="error"></div>
      <div class="sidebar-stats" id="statsBar"></div>

      <details class="site-editor-section site-section-card site-top-info-section" data-site-section="top-info" open>
        <summary class="site-section-summary">
          <span class="site-section-title">文章顶部信息</span>
          <span class="site-section-chevron" aria-hidden="true"></span>
        </summary>
        <div class="site-section-body site-meta-form">
          <label class="site-field-row" for="siteArticleTitleInput">
            <span class="site-field-label">标题 <span aria-hidden="true">*</span></span>
            <input class="site-field-control" id="siteArticleTitleInput" type="text" autocomplete="off">
          </label>
          <label class="site-field-row" for="siteArticleAuthorInput">
            <span class="site-field-label">作者 <span aria-hidden="true">*</span></span>
            <span class="site-input-wrap">
              <input class="site-field-control" id="siteArticleAuthorInput" type="text" maxlength="20" autocomplete="off">
              <span class="site-field-count" data-site-count-for="siteArticleAuthorInput">0/20</span>
            </span>
          </label>
          <label class="site-field-row" for="siteArticleSummaryInput">
            <span class="site-field-label">摘要 <span aria-hidden="true">*</span></span>
            <span class="site-input-wrap">
              <textarea class="site-field-control site-field-textarea" id="siteArticleSummaryInput" rows="4" maxlength="200" placeholder="请输入文章摘要"></textarea>
              <span class="site-field-count" data-site-count-for="siteArticleSummaryInput">0/200</span>
            </span>
          </label>
          <div class="site-field-row">
            <span class="site-field-label">标签</span>
            <div class="site-tag-editor" id="siteArticleTagsEditor" aria-label="文章标签"></div>
          </div>
        </div>
      </details>

      <details class="site-editor-section site-section-card ft-advanced-options ft-footer-area" data-site-section="footer-trailer" id="footerLib" open>
        <summary class="site-section-summary ft-footer-summary">
          <span class="site-section-title">文章底部拖尾</span>
          <span class="site-section-chevron" aria-hidden="true"></span>
        </summary>
        <div class="site-section-body ft-adv-body">
          <div class="site-footer-strategy-inline" aria-label="排版策略">
            <div class="site-strategy-grid" role="group" aria-label="排版策略">
              <button type="button" class="site-strategy-card is-active" data-site-strategy="original" aria-pressed="true">
                <span class="site-strategy-name">原创</span>
                <span class="site-strategy-desc">上传、正文默认</span>
              </button>
              <button type="button" class="site-strategy-card" data-site-strategy="repost" aria-pressed="false">
                <span class="site-strategy-name">转载</span>
                <span class="site-strategy-desc">URL 导入默认</span>
              </button>
            </div>
          </div>
          <div class="ft-footer-technical-controls" hidden aria-hidden="true">
            <button type="button" class="ft-switch" id="footerEnableToggle" hidden role="switch" aria-checked="true" aria-label="显示底部区域" data-footer-area-switch="enabled">
              <span class="ft-switch-knob"></span>
            </button>
            <div class="ft-footer-presets" id="footerPresets" hidden></div>
            <div class="ft-footer-off-note" id="footerOffNote" hidden>本文不输出底部区域，预览和复制都不会包含这些模块。</div>
          </div>
          <div class="ft-footer-table">
            <div class="ft-footer-segments" id="footerSegments" role="list" aria-label="文章底部拖尾模块"></div>
          </div>
        </div>
      </details>
    </div>
  </aside>

  <div class="rail-divider" id="railDivider" role="separator" aria-orientation="vertical" aria-label="调整左栏宽度">
    <button class="rail-divider-toggle" id="railToggleBtn" type="button" aria-label="收起左栏" aria-expanded="true" title="收起左栏">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
  </div>

  <!-- ======== Preview Panel ======== -->
  <main class="preview-panel preview-site" data-screen-label="预览区">
    <div class="preview-scroll scroll-y" id="previewScroll">
      <!-- Empty state -->
      <div class="empty empty-state" id="emptyState">
        <div class="empty-ico">
          <svg viewBox="0 0 24 24" width="88" height="88" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/></svg>
        </div>
        <div class="empty-title">还没有内容</div>
        <div class="empty-sub">上传 Word / Markdown 文件，或粘贴 FoodTalks 文章链接 / 正文，预览会在这里实时呈现。</div>
      </div>

      <!-- Preview content -->
      <div class="preview-content" id="previewContent" style="display:none;">
        <div class="wx-header ft-article-header">
          <h2 class="wx-title" id="articleTitle"></h2>
          <!-- 网站渠道文章头：仿 foodtalks.cn 文章页。纯预览装饰，不进复制层。 -->
          <div class="ft-article-info">
            <div class="wx-meta ft-byline ft-article-info-left">
              <span class="ft-meta-item ft-meta-author">
                <span class="ft-byline-icon" aria-hidden="true">
                  <svg viewBox="0 0 16 16" width="15" height="14" fill="currentColor"><path d="M8 7.8a3.4 3.4 0 100-6.8 3.4 3.4 0 000 6.8zm0 1.35c-3.15 0-6.35 1.55-6.35 3.65V15h12.7v-2.2c0-2.1-3.2-3.65-6.35-3.65z"/></svg>
                </span>
                <span class="wx-meta-account">FBIF食品饮料创新</span>
              </span>
              <span class="ft-meta-item">
                <span class="ft-byline-icon" aria-hidden="true">
                  <svg class="ft-time-svg" viewBox="0 0 10 10" width="10" height="10" aria-hidden="true">
                    <g stroke="none" stroke-width="1" fill="none" fill-rule="evenodd">
                      <g transform="translate(-233.000000, -73.000000)">
                        <g transform="translate(230.000000, 70.000000)">
                          <rect fill="#EFEFEF" opacity="0" x="0" y="0" width="16" height="16"></rect>
                          <circle fill="#C9C9C9" transform="translate(8.000000, 8.000000) rotate(90.000000) translate(-8.000000, -8.000000) " cx="8" cy="8" r="5"></circle>
                          <rect fill="#FFFFFF" transform="translate(7.500000, 7.000000) rotate(90.000000) translate(-7.500000, -7.000000) " x="5.5" y="6.5" width="4" height="1" rx="0.5"></rect>
                          <rect fill="#FFFFFF" transform="translate(9.000000, 8.500000) rotate(180.000000) translate(-9.000000, -8.500000) " x="7" y="8" width="4" height="1" rx="0.5"></rect>
                        </g>
                      </g>
                    </g>
                  </svg>
                </span>
                <span class="wx-meta-gray" id="wxDate"></span>
              </span>
              <span class="ft-meta-item">
                <span class="ft-byline-icon" aria-hidden="true">
                  <svg viewBox="0 0 20 16" width="20" height="16" fill="currentColor"><path d="M10 2.2c4.2 0 7.2 3.25 8.1 5.8-.9 2.55-3.9 5.8-8.1 5.8S2.8 10.55 1.9 8C2.8 5.45 5.8 2.2 10 2.2zm0 1.25C6.65 3.45 4.1 5.9 3.25 8c.85 2.1 3.4 4.55 6.75 4.55S16.9 10.1 17.75 8C16.9 5.9 13.35 3.45 10 3.45zm0 1.55a3 3 0 110 6 3 3 0 010-6z"/></svg>
                </span>
                <span class="wx-meta-gray" id="ftReadCount"></span>
              </span>
              <span class="wx-meta-gray wx-meta-loc">上海</span>
            </div>
            <div class="ft-article-info-right">
              <button type="button" class="ft-share-button" id="ftShareButton" aria-label="分享" aria-expanded="false" aria-controls="ftSharePopover">
                <svg class="ft-share-svg" width="59" height="24" viewBox="0 0 59 24" aria-hidden="true">
                  <g stroke="none" stroke-width="1" fill="none" fill-rule="evenodd">
                    <g>

                      <path d="M10,2 L49,2 L49,2 L41,5 L37,12 L41,19.5 L49,22 L10,22 C4.4771525,22 6.76353751e-16,17.5228475 0,12 C-6.76353751e-16,6.4771525 4.4771525,2 10,2 Z" fill="#F5F8FA"></path>
                      <path d="M47,2 C41.4758564,2 37,6.47585642 37,12 C37,17.5241415 41.4758564,22 47,22 C52.5241415,22 57,17.5241415 57,12 C57.0024998,6.4783583 52.5241415,2 47,2 Z M53.0970711,12.1125834 L47.8031012,16.0555402 C47.7105318,16.1280946 47.5929436,16.1706265 47.4653479,16.1706265 C47.1701265,16.1706265 46.9299464,15.9429558 46.9099314,15.65524 L46.9099314,13.7112822 L45.4338245,13.7112822 C43.5999493,13.7112822 41.9412054,14.4218151 40.7077804,15.5826856 C40.6677504,15.6127081 40.6202148,15.6327231 40.5651735,15.6327231 C40.4375778,15.6327231 40.332499,15.5301462 40.332499,15.4025505 C40.332499,15.3900411 40.3350009,15.3775317 40.3350009,15.3650224 C40.9529643,12.3277447 43.6925187,10.0235168 46.9099314,9.89592111 L46.9099314,7.93445022 C46.9324483,7.64673446 47.1701265,7.41906373 47.4653479,7.41906373 C47.585438,7.41906373 47.7005243,7.45909375 47.7905918,7.5266444 L53.1020749,11.4821106 C53.1896405,11.5596688 53.247259,11.6722532 53.247259,11.7948451 C53.2496856,11.9224408 53.1896405,12.0350252 53.0970711,12.1125834 L53.0970711,12.1125834 Z" fill="#CACCCD" fill-rule="nonzero"></path>
                    </g>
                    <text font-family="NotoSansCJKsc-Medium, Noto Sans CJK SC" font-size="12" font-weight="400" fill="#CACCCD">
                      <tspan x="9" y="17">分享</tspan>
                    </text>
                  </g>
                </svg>
              </button>
              <div class="ft-share-popover" id="ftSharePopover" hidden role="dialog" aria-label="分享二维码">
                <div class="ft-qr-frame" aria-hidden="true">
                  <span class="ft-qr-corner ft-qr-corner-tl"></span>
                  <span class="ft-qr-corner ft-qr-corner-tr"></span>
                  <span class="ft-qr-corner ft-qr-corner-bl"></span>
                  <span class="ft-qr-corner ft-qr-corner-br"></span>
                  <svg class="ft-fake-qr" viewBox="0 0 116 116" width="116" height="116" aria-hidden="true">
                    <rect width="116" height="116" fill="#fff"/>
                    <path fill="#000" d="M8 8h28v28H8V8zm6 6v16h16V14H14zm66-6h28v28H80V8zm6 6v16h16V14H86zM8 80h28v28H8V80zm6 6v16h16V86H14zM44 8h8v8h-8V8zm16 0h8v8h-8V8zM44 20h8v8h-8v-8zm24 0h8v8h-8v-8zM44 32h16v8H44v-8zm24 8h8v8h-8v-8zM8 44h8v8H8v-8zm16 0h16v8H24v-8zm24 0h8v8h-8v-8zm16 0h16v8H64v-8zm32 0h12v8H96v-8zM16 56h8v8h-8v-8zm16 0h8v8h-8v-8zm24 0h16v8H56v-8zm24 0h8v8h-8v-8zm16 0h8v8h-8v-8zM8 68h24v8H8v-8zm40 0h8v8h-8v-8zm16 0h8v8h-8v-8zm24 0h20v8H88v-8zM44 80h8v8h-8v-8zm16 0h24v8H60v-8zm36 0h12v8H96v-8zM44 92h20v8H44v-8zm28 0h8v8h-8v-8zm16 0h8v8h-8v-8zM56 104h8v8h-8v-8zm16 0h20v8H72v-8zm28 0h8v8h-8v-8z"/>
                  </svg>
                </div>
                <div class="ft-share-caption" id="ftShareQrCaption"></div>
                <div class="ft-share-separator"></div>
                <button type="button" class="ft-copy-link" id="ftShareCopyText"></button>
              </div>
            </div>
          </div>
          <div class="ft-preview-tags" id="ftPreviewTags" aria-label="文章标签"></div>
          <blockquote class="ft-summary" id="ftSummary" hidden></blockquote>
        </div>
        <div class="phone-frame" id="phoneFrame">
          <div id="contentArea"></div>
        </div>
        <div class="copy-success" id="copySuccess">已复制到剪贴板</div>
      </div>

      <!-- WeChat footer -->
      <div class="wx-footer" id="wxFooter" style="display:none;">
        <div class="wx-footer-inner">
          <div class="wx-footer-left">
            <img class="wx-avatar" src="/fbif-avatar.webp" alt="FBIF">
            <span class="wx-footer-name">FBIF食品饮料创新</span>
            <svg class="wx-verified" viewBox="0 0 16 16" width="14" height="14"><circle cx="8" cy="8" r="7" fill="#576b95"/><path d="M5 8.2l2.2 2.2L11.5 6" stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
          <div class="wx-footer-actions">

<script type="module">
import { pickActivePreset } from '/js/blocks/block-merge.js';

import {

// ---- Version ----
async function loadVersionInfo() {
  try { const r = await fetch('/version.json?ts=' + Date.now(), { cache: 'no-store' }); if (r.ok) return await r.json(); } catch {}
  return { build: 'runtime-' + Date.now() };
}
const versionInfo = await loadVersionInfo();
const rawBuildId = String(versionInfo.build || versionInfo.commit || Date.now());
const isDevBuild = rawBuildId === 'dev';
const buildId = isDevBuild ? 'dev-' + Date.now() : rawBuildId;
const assetVersion = encodeURIComponent(buildId);
window.__APP_BUILD_INFO = { ...versionInfo, asset_version: buildId };
if (!new URLSearchParams(location.search).get('v')) {
  const next = new URL(location.href); next.searchParams.set('v', buildId); history.replaceState(null, '', next);
}
// <head> 里的 <link rel=stylesheet> 是裸 URL（无 ?v=），JS import 却都带 ?v=assetVersion。
// 于是部署后 JS 走新 URL 必然刷新，CSS 因 URL 不变、被浏览器/代理按旧缓存直接复用而变陈旧。
// 这里给同源 CSS 链接补上同一构建号：每次部署 CSS 都是全新 URL（命中服务端 versioned 长缓存），
// 旧缓存无法遮挡，与 JS 治理口径一致（与 app.html 同一修复）。
for (const link of document.querySelectorAll('link[rel="stylesheet"]')) {
  const href = link.getAttribute('href') || '';

}
const { installVersionRefresh } = await import('/js/version-refresh.js?v=' + assetVersion);
installVersionRefresh({ currentBuildId: rawBuildId, isDevBuild, loadVersionInfo });

}

let activeRulePack = rulePackModule.getRulePack(initialRulePackID());
window._activeRulePack = activeRulePack;

// 统一顶栏账号菜单：网站侧无同模板同伴，任何账号切换都是跨模板，直接跳转到目标

mountAccountMenu({

  onSwitch: (id) => {
    if (window.fetchArticle && typeof window.fetchArticle.invalidate === 'function') window.fetchArticle.invalidate();
    const pack = rulePackModule.getRulePack(id);
    location.href = rulePackUrlModule.buildPath(pack.channel, pack.id);

const ruleModule = await import('/js/rule-presets.js?v=' + assetVersion);
const {
  loadActiveRulePreset,
  loadLocalRuleConfig,
  saveLocalRuleConfig,
  applyActiveRuleConfig,
  adminLogin,
  listPublicRulePresets,
  normalizeRuleConfig,
  setActiveRulePreset,
} = ruleModule;

// 「当前规则」选择器：共享模块（架构体检 S1——此前这一族 ~17 个函数在 app/site 双份复制）。
// 网站口径：只读态「已锁定」徽章 + 铅笔编辑入口；server 预设原样落本地缓存。
const { createActiveRuleSelector, escText } = await import('/js/active-rule-selector.js?v=' + assetVersion);
const ruleSelector = createActiveRuleSelector({
  documentRef: document,
  windowRef: window,
  getPack: () => activeRulePack,
  ruleModule,
  refreshRuleConsumers: (opts) => refreshRuleConsumers(opts),
  readonlyLabel: '规则',
  readonlyEditEntry: true,
  initialSource: 'local',
  initialPresetID: 'local',
});
const {
  renderActiveRuleCard, hydrateActiveRulePreset, refreshActiveRuleCatalog,
  beginActiveRuleEdit, cancelActiveRuleEdit, ensureRuleAdminPassword,
  cacheServerRuleFallback, localActiveRulePreset, loadRuleCatalog,
} = ruleSelector;

const initialRule = { source: 'local', preset: localActiveRulePreset(activeRulePack.id) };
applyActiveRuleConfig(initialRule.preset.config, initialRule.preset);

function refreshRuleConsumers(options = {}) {
  syncWorkflowControls();
  const previewSync = syncEngineConfig(options.rerender === true);
  const finalize = result => {
    renderActiveRuleCard();
    if (window.updateThemePreview) window.updateThemePreview(loadConfig());
    if (window._updateFooter) window._updateFooter(null);
    return result;
  };
  return previewSync && typeof previewSync.then === 'function'
    ? previewSync.then(finalize)
    : finalize(previewSync);
}

function applyRulePackChrome(pack) {
  const displayName = pack.previewAccountName || pack.accountName;
  document.querySelectorAll('.wx-meta-account').forEach(el => { el.textContent = displayName; });
  document.querySelectorAll('.wx-footer-name').forEach(el => { el.textContent = displayName; });
  document.querySelectorAll('.wx-avatar').forEach(el => {
    el.src = pack.avatarUrl;
    el.alt = displayName;
  });
  const locationEl = document.querySelector('.wx-meta .wx-meta-gray:last-child');
  if (locationEl) locationEl.textContent = pack.location || '上海';
}
applyRulePackChrome(activeRulePack);
renderActiveRuleCard();


function loadConfig() {
  return normalizeRuleConfig((window._activeConfig && window._activeConfig.config) || loadLocalRuleConfig(activeRulePack.id));
}

// 从服务端激活规则取页脚库【内容】（segments html_lines / presets / segment_order）。
// 绕过 normalizeRuleConfig——它只重建已知 module（theme/supporting/...），会丢弃结构化的
// fbif_footer。无服务端内容时返回空对象，由 buildFooterHtml 降级到 footer-segments-defaults。
function serverRuleModules() {
  const ac = window._activeConfig || {};
  let cfg = (ac.preset && (ac.preset.raw_config || ac.preset.config)) || ac.config || {};
  if (cfg && cfg.config && cfg.config.modules) cfg = cfg.config; // 兼容 schema_version 2 嵌套
  return (cfg && cfg.modules && typeof cfg.modules === 'object') ? cfg.modules : {};
}

function serverFooterLibrary() {
  const mods = serverRuleModules();
  return (mods.fbif_footer && typeof mods.fbif_footer === 'object') ? mods.fbif_footer : {};
}

function serverAssetLibrary() {
  const mods = serverRuleModules();
  return (mods.asset_library && typeof mods.asset_library === 'object') ? mods.asset_library : {};
}

function activeBottomBlocks() {
  const mod = serverRuleModules().bottom_blocks;
  if (!mod || typeof mod !== 'object') return {};
  const active = pickActivePreset(mod);
  return active && typeof active.blocks === 'object' ? active.blocks : {};
}

const FT_FOOTER_LABELS_DEFAULT = Object.freeze({
  tip: '提示声明',
  biz_coop: '商务合作',
  join_group: '加入微信群（二维码）',
  follow_account: '关注公众号（二维码）',
  logo: 'FoodTalks logo',
  more_info: '点击获取更多',
});
const FT_FOOTER_LABELS_SERIES = Object.freeze({
  ...FT_FOOTER_LABELS_DEFAULT,
  biz_coop: '什么是系列商务合作',
  bd_card: 'BD 名片',
  coop_table: '相关合作表',
  join_group: '加入FBIF饮料群（二维码）',
});
function footerSegmentLabel(key) {
  const labels = activeRulePack && activeRulePack.id === 'ft-series'
    ? FT_FOOTER_LABELS_SERIES
    : FT_FOOTER_LABELS_DEFAULT;
  return labels[key] || key;
}
const FT_FOOTER_BD_CARD_RE = /^ftss_bd_[a-z0-9_-]+$/i;
const FOOTER_ASSET_TOKEN_RE = /\{\{asset(?:#|:)[a-z0-9_-]+\}\}/i;
let footerBdCardAssetID = '';
let footerLastArticlePayload = null;
let footerSegmentFields = {};
let refreshFooterControls = () => {};
let saveFooterArticleOverrideState = () => {};

function footerAssets(assetLibrary = serverAssetLibrary()) {
  return assetLibrary && Array.isArray(assetLibrary.assets) ? assetLibrary.assets : [];
}

function isFooterBdCardAsset(asset) {
  if (!asset || !asset.url) return false;
  const id = String(asset.id || '').trim();
  const tags = Array.isArray(asset.tags) ? asset.tags.map(tag => String(tag || '').trim()) : [];
  return FT_FOOTER_BD_CARD_RE.test(id) || tags.some(tag => /^BD\s*名片$/i.test(tag));
}

function footerBdCardAssets() {
  if (!activeRulePack || activeRulePack.id !== 'ft-series') return [];
  return footerAssets().filter(isFooterBdCardAsset);
}

function footerAssetByID(id) {
  if (!id) return null;
  return footerAssets().find(asset => String(asset && asset.id || '') === String(id)) || null;
}

function footerAssetInScope(asset, scope = 'ft-default') {
  const assetScope = String(asset && asset.scope || 'global').trim() || 'global';
  return assetScope === 'global' || assetScope === scope;
}

function footerAssetForToken(token, scope = 'ft-default') {
  const match = String(token || '').match(/^\{\{asset(?::([a-z0-9_-]+)|#([a-z0-9_-]+))\}\}$/i);
  if (!match) return null;
  const usage = match[1] || '';
  const id = match[2] || '';
  return footerAssets().find(asset => {
    if (!footerAssetInScope(asset, scope)) return false;
    if (id) return String(asset && asset.id || '') === id;
    return String(asset && asset.usage || '') === usage;
  }) || null;
}

function footerFieldsFromOverride(override) {
  const out = {};
  const overrides = override && override.overrides && typeof override.overrides === 'object' ? override.overrides : {};
  for (const id of Object.keys(overrides)) {
    const fields = overrides[id] && overrides[id].fields;
    if (fields && typeof fields === 'object' && !Array.isArray(fields) && Object.keys(fields).length) {
      out[id] = { ...fields };
    }
  }
  return out;
}

function footerSegmentDefaultHtmlLines(key) {
  const block = activeBottomBlocks()[key];
  if (block && block.type === 'rich_html' && block.fields && Array.isArray(block.fields.html_lines)) {
    return block.fields.html_lines.slice();
  }
  const segments = serverFooterLibrary().segments;
  const entry = segments && typeof segments === 'object' ? segments[key] : null;
  if (Array.isArray(entry)) return entry.slice();
  if (entry && Array.isArray(entry.html_lines)) return entry.html_lines.slice();
  return [];
}

function footerSegmentCurrentHtmlLines(key) {
  const fields = footerSegmentFields[key];
  if (fields && Array.isArray(fields.html_lines)) return fields.html_lines.slice();
  return footerSegmentDefaultHtmlLines(key);
}

function footerSegmentAssetToken(key) {
  const line = footerSegmentDefaultHtmlLines(key).map(v => String(v || '')).find(v => FOOTER_ASSET_TOKEN_RE.test(v)) || '';
  const match = line.match(FOOTER_ASSET_TOKEN_RE);
  return match ? match[0] : '';
}

function stripFooterPreviewText(lines) {
  return String((lines || []).join(' '))
    .replace(/<script[\s\S]*?<\/script>/gi, ' ')
    .replace(/<style[\s\S]*?<\/style>/gi, ' ')
    .replace(/<[^>]+>/g, ' ')
    .replace(/&nbsp;/g, ' ')
    .replace(/&ldquo;|&rdquo;/g, '"')
    .replace(/&amp;/g, '&')
    .replace(/\s+/g, ' ')
    .trim();
}

function footerSegmentPreviewHtml(key) {
  const lines = footerSegmentCurrentHtmlLines(key);
  const token = (lines.join('\n').match(FOOTER_ASSET_TOKEN_RE) || [footerSegmentAssetToken(key)])[0];
  const thumb = token ? resolveAssetThumb(token, serverAssetLibrary(), 'ft-default') : '';
  const text = stripFooterPreviewText(lines);
  if (thumb) {
    return `<span class="ft-footer-preview-thumb"><img src="${escText(thumb)}" alt="${escText(footerSegmentLabel(key))}" loading="lazy"></span><span class="ft-footer-preview-text">${escText(text || footerSegmentLabel(key))}</span>`;
  }
  return `<span class="ft-footer-preview-text">${escText(text || '按规则默认')}</span>`;
}

function footerSegmentDefaultAssetID(key) {
  const asset = footerAssetForToken(footerSegmentAssetToken(key), 'ft-default');
  return asset && asset.id ? String(asset.id) : '';
}

function replaceFooterSegmentAssetRef(lines, assetID) {
  const nextRef = '{{asset#' + assetID + '}}';
  let replaced = false;
  return (lines || []).map(line => String(line || '').replace(FOOTER_ASSET_TOKEN_RE, token => {
    if (replaced) return token;
    replaced = true;
    return nextRef;
  }));
}

function sameFooterHtmlLines(a, b) {
  const aa = Array.isArray(a) ? a : [];
  const bb = Array.isArray(b) ? b : [];
  if (aa.length !== bb.length) return false;
  for (let i = 0; i < aa.length; i += 1) {
    if (String(aa[i] || '') !== String(bb[i] || '')) return false;
  }
  return true;
}

function footerSegmentAssetControlHtml(key) {
  if (key === 'bd_card' || !footerSegmentAssetToken(key)) return '';
  const hasOverride = !!(footerSegmentFields[key] && footerSegmentFields[key].html_lines);
  return `<div class="ft-footer-asset-control" data-footer-asset-control="${escText(key)}">
    <div class="ft-footer-asset-actions">
      <button type="button" class="ft-footer-asset-btn" data-footer-asset-pick="${escText(key)}">替换图片</button>
      <button type="button" class="ft-footer-asset-reset" data-footer-asset-reset="${escText(key)}" ${hasOverride ? '' : 'hidden'}>恢复默认</button>
    </div>
  </div>`;
}

function replaceBdCardAssetRef(lines, assetID) {
  if (!assetID) return lines;
  const nextRef = '{{asset#' + assetID + '}}';
  return (lines || []).map(line => String(line || '').replace(/\{\{asset#[a-z0-9_-]+\}\}/i, nextRef));
}

function footerDefaultBdCardAssetID(footerLib = serverFooterLibrary()) {
  const segments = footerLib && footerLib.segments && typeof footerLib.segments === 'object' ? footerLib.segments : null;
  const entry = segments && segments.bd_card;
  const htmlLines = Array.isArray(entry) ? entry : (entry && Array.isArray(entry.html_lines) ? entry.html_lines : []);
  const line = htmlLines.map(v => String(v || '')).find(v => /\{\{asset#[a-z0-9_-]+\}\}/i.test(v)) || '';
  const match = line.match(/\{\{asset#([a-z0-9_-]+)\}\}/i);
  return match ? match[1] : '';
}

function footerSelectedBdCardAsset() {
  return footerAssetByID(footerBdCardAssetID) || footerAssetByID(footerDefaultBdCardAssetID());
}

function applyFooterArticleOverrides(footerLib) {
  const hasFieldOverrides = footerSegmentFields && Object.keys(footerSegmentFields).length > 0;
  if ((!footerBdCardAssetID && !hasFieldOverrides) || !footerLib || typeof footerLib !== 'object') return footerLib;
  const segments = footerLib.segments && typeof footerLib.segments === 'object' ? footerLib.segments : null;
  let nextSegments = segments;
  function ensureNextSegments() {
    if (nextSegments === segments) nextSegments = { ...(segments || {}) };
    return nextSegments;
  }

  const entry = segments && segments.bd_card;
  const htmlLines = Array.isArray(entry) ? entry : (entry && Array.isArray(entry.html_lines) ? entry.html_lines : null);
  if (footerBdCardAssetID && htmlLines) {
    const target = ensureNextSegments();
    target.bd_card = Array.isArray(entry)
      ? replaceBdCardAssetRef(entry, footerBdCardAssetID)
      : { ...entry, html_lines: replaceBdCardAssetRef(htmlLines, footerBdCardAssetID) };
  }

  for (const key of Object.keys(footerSegmentFields || {})) {
    const fields = footerSegmentFields[key];
    if (!fields || !Array.isArray(fields.html_lines)) continue;
    const entry = segments && segments[key];
    const target = ensureNextSegments();
    target[key] = Array.isArray(entry)
      ? fields.html_lines.slice()
      : { ...(entry || {}), html_lines: fields.html_lines.slice() };
  }

  if (nextSegments === segments) return footerLib;
  return {
    ...footerLib,
    segments: nextSegments,
  };
}

function clearFooterArticleOverrides(rerender = false, resetPayload = true) {
  if (resetPayload) footerLastArticlePayload = null;
  const hadBdCard = !!footerBdCardAssetID;
  const hadSegmentFields = !!(footerSegmentFields && Object.keys(footerSegmentFields).length);
  if (!hadBdCard && !hadSegmentFields) return false;
  footerBdCardAssetID = '';
  if (hadSegmentFields) {
    footerSegmentFields = {};
    saveFooterArticleOverrideState();
  }
  refreshFooterControls();
  if (rerender) syncEngineConfig(true);
  return true;
}

function resetFooterArticleOverridesFor(session) {
  const input = session && session.input;
  const payload = input && (input.payload || input.title || null);
  if (!payload || payload === footerLastArticlePayload) return false;
  footerLastArticlePayload = payload;
  return clearFooterArticleOverrides(true, false);
}

function readFooterState() {
  const state = readFooterPanelState({
    storage: localStorage,
    accountId: activeRulePack.id,
    footerLib: serverFooterLibrary(),
  });
  footerSegmentFields = footerFieldsFromOverride(state.override);
  return state;
}

function disabledFooterSegments(segments, order = []) {
  const next = {};
  for (const key of ['tip', ...order, ...Object.keys(segments || {})]) {
    if (key) next[key] = 0;
  }
  return next;
}

function footerSegmentEnabledForBlock(id, block, effectiveSegments, footerEnabled) {
  if (!footerEnabled) return false;
  if (effectiveSegments && Object.prototype.hasOwnProperty.call(effectiveSegments, id)) {
    return !!effectiveSegments[id];
  }
  return !(block && block.enabled === false);
}

// 把当前规则（扁平参数 + 行为 + 模块开关）注入排版引擎的渲染配置。
// 命门：扁平参数（muted_color 等）必须并进去，否则网站模板读不到，
// 后台改颜色不生效（见 specs/2026-05-28-unified-rule-engine-design.md §3）。
function syncEngineConfig(triggerRerender) {
  if (!window._engineApi || !window._engineApi.setActiveConfig) return { status: 'unavailable' };
  const flat = loadConfig();
  const prev = (window._engineApi.getActiveConfig && window._engineApi.getActiveConfig()) || {};
  const prevModules = prev.modules || {};
  const serverBehavior = (window._activeConfig && window._activeConfig.behavior) || {};
  // 页脚库【内容】（segments html_lines / presets / segment_order）以服务端 /api/rules
  // 为准——直接从 raw _activeConfig.config 取，绕过 normalizeRuleConfig（它只认已知
  // module、会丢弃结构化的 fbif_footer）。服务端无内容时由 buildFooterHtml 降级默认。
  const footerState = readFooterState();
  const serverFooter = footerState.footerLib;
  const footerEnabled = footerState.enabled;
  const footerActiveSegments = footerState.segments;
  const footerOrder = footerState.order;
  const effectiveFooterSegments = footerEnabled ? footerActiveSegments : disabledFooterSegments(footerActiveSegments, footerOrder);
  const serverAssets = serverAssetLibrary();
  const serverBottomBlocks = serverRuleModules().bottom_blocks;
  const baseFooterForRender = Array.isArray(footerOrder) && footerOrder.length
    ? { ...serverFooter, segment_order: footerOrder.filter(k => k !== 'tip') }
    : serverFooter;
  const footerForRender = applyFooterArticleOverrides(baseFooterForRender);
  // 统一区块模型：面板内部状态已收敛为 bottom_blocks override（开关/排序/逐块启用）。
  // 逐块 enabled = !!active_segments[id]（缺失视为关），与旧 buildFooterHtml 的 `if(!seg[key])continue` 一致。
  let bottomBlocksOverride;
  if (serverBottomBlocks && typeof serverBottomBlocks === 'object') {
    // v2：order 在 active preset 内（复用 block-merge 的 pickActivePreset 选预设）。
    const bbActive = pickActivePreset(serverBottomBlocks);
    const bbOrder = Array.isArray(bbActive.order) ? bbActive.order : [];
    const bbBlocks = bbActive && typeof bbActive.blocks === 'object' ? bbActive.blocks : {};
    const overrides = {};
    for (const id of bbOrder) {
      if (id === 'tip') continue;
      overrides[id] = { enabled: footerSegmentEnabledForBlock(id, bbBlocks[id], effectiveFooterSegments, footerEnabled) };
      if (footerSegmentFields[id] && Object.keys(footerSegmentFields[id]).length) {
        overrides[id] = { ...overrides[id], fields: footerSegmentFields[id] };
      }
    }
    bottomBlocksOverride = { enabled: footerEnabled, overrides };
    if (Array.isArray(footerOrder) && footerOrder.length) {
      bottomBlocksOverride.order = footerOrder.filter(k => k !== 'tip');
    }
  }
  const cfg = {
    ...flat,
    behavior: serverBehavior,
    _bottomBlocksOverride: bottomBlocksOverride,
    modules: {
      ...prevModules,
      fbif_footer: {
        ...footerForRender,
        enabled: footerEnabled,
        active_preset_id: '__article_override__',
        presets: [{ id: '__article_override__', name: '本篇', segments: effectiveFooterSegments }],
        active_segments: effectiveFooterSegments,
      },
      asset_library: serverAssets,
      ...(serverBottomBlocks && typeof serverBottomBlocks === 'object' ? { bottom_blocks: serverBottomBlocks } : {}),
      // 网站渠道 h2 默认不输出 mctoc 锚点 id —— FoodTalks 后台生成目录时会自己加
      // （用户 2026-05-30 确认），基石 news/62285 的 h2 也不带 id。默认关，避免与后台冲突。
      mctoc: prevModules.mctoc || { enabled: false },
    },
  };
  window._engineApi.setActiveConfig(cfg);
  return requestRulePreviewSync(window._engineApi, triggerRerender);
}

  applyActiveRuleConfig(config, preset || (window._activeConfig && window._activeConfig.preset));
  if (options.refresh !== false) refreshRuleConsumers();
  return normalized;
}

function siteDefaultTags() {

function parseSiteTags(value) {
  return String(value == null ? '' : value)
    .split(/[，,、\n]+/)
    .map(tag => tag.trim())
    .filter(Boolean)
    .slice(0, 12);
}

function normalizeSiteTagList(tags) {
  const list = Array.isArray(tags) ? tags : parseSiteTags(tags);
  return list
    .map(tag => String(tag || '').trim())
    .filter(Boolean)
    .slice(0, 12);
}

function renderSiteTagEditor() {
  if (!siteArticleTagsEditor) return;
  siteArticleTagsEditor.replaceChildren();
  const tags = siteArticleMeta.tags.length ? siteArticleMeta.tags : siteDefaultTags();
  tags.forEach((label, index) => {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'site-tag-chip';
    button.dataset.siteTagIndex = String(index);
    button.textContent = label;
    button.addEventListener('click', () => editSiteTagAt(index));
    siteArticleTagsEditor.appendChild(button);
  });
  const addButton = document.createElement('button');
  addButton.type = 'button';
  addButton.className = 'site-tag-add';
  addButton.setAttribute('aria-label', '新增标签');
  addButton.textContent = '+';
  addButton.addEventListener('click', addSiteTag);
  siteArticleTagsEditor.appendChild(addButton);
}

function editSiteTagAt(index) {
  const tags = normalizeSiteTagList(siteArticleMeta.tags.length ? siteArticleMeta.tags : siteDefaultTags());
  const current = tags[index] || '';
  const chip = siteArticleTagsEditor && siteArticleTagsEditor.querySelector(`[data-site-tag-index="${index}"]`);
  if (!chip) return;
  const input = document.createElement('input');
  input.className = 'site-tag-input';
  input.type = 'text';
  input.maxLength = 24;
  input.value = current;
  input.setAttribute('aria-label', '编辑标签');
  let done = false;
  const finish = commit => {
    if (done) return;
    done = true;
    if (!commit) {
      renderSiteTagEditor();
      return;
    }
    const clean = input.value.trim();
    siteArticleMetaDirty.tags = true;
    if (clean) tags[index] = clean;
    else tags.splice(index, 1);
    setSiteArticleMeta({ tags }, { writeInputs: false });
  };
  input.addEventListener('keydown', event => {
    if (event.key === 'Enter') finish(true);
    if (event.key === 'Escape') finish(false);
  });
  input.addEventListener('blur', () => finish(true));
  chip.replaceWith(input);
  input.focus();
  input.select();
}

function addSiteTag() {
  const tags = normalizeSiteTagList(siteArticleMeta.tags.length ? siteArticleMeta.tags : siteDefaultTags());
  if (tags.length >= 12) return;
  if (!siteArticleTagsEditor) return;
  const addButton = siteArticleTagsEditor.querySelector('.site-tag-add');
  const input = document.createElement('input');
  input.className = 'site-tag-input';
  input.type = 'text';
  input.maxLength = 24;
  input.setAttribute('aria-label', '新增标签');
  let done = false;
  const finish = commit => {
    if (done) return;
    done = true;
    const clean = input.value.trim();
    if (!commit || !clean) {
      renderSiteTagEditor();
      return;
    }
    siteArticleMetaDirty.tags = true;
    tags.push(clean);
    setSiteArticleMeta({ tags }, { writeInputs: false });
  };
  input.addEventListener('keydown', event => {
    if (event.key === 'Enter') finish(true);
    if (event.key === 'Escape') finish(false);
  });
  input.addEventListener('blur', () => finish(true));
  siteArticleTagsEditor.insertBefore(input, addButton || null);
  input.focus();
}

function plainTextFromRuns(runs) {
  return (runs || []).map(run => String((run && (run.text || run.value)) || '')).join('');
}

function extractAuthorFromText(text) {
  const compact = String(text || '').replace(/\s+/g, ' ').trim();
  if (!compact) return '';
  const match = compact.match(/(?:本文作者|作者|Author)\s*[：:]\s*([^,，。；;\n]+)/i);
  return match ? match[1].trim() : '';
}

function collectInputTextSamples(input) {
  const payload = input && input.payload;
  if (!payload) return [];
  if (typeof payload === 'string') return payload.split(/\r?\n/).slice(0, 30);
  if (Array.isArray(payload.paragraphs)) {
    return payload.paragraphs.map(p => {
      if (!p) return '';
      if (typeof p.text === 'string') return p.text;
      return plainTextFromRuns(p.runs || []);
    });
  }
  if (Array.isArray(payload.blocks)) {
    return payload.blocks.map(block => {
      if (!block) return '';
      if (typeof block.text === 'string') return block.text;
      return plainTextFromRuns(block.runs || []);
    });
  }
  return [];
}

function extractSiteAuthorFromInput(input) {
  for (const text of collectInputTextSamples(input)) {
    const author = extractAuthorFromText(text);
    if (author) return author;
  }
  return '';
}

function siteMetaFromSession(session) {
  const articleMeta = session && session.articleMeta || {};
  const result = session && session.result || {};
  return {
    title: String((session && (session.title || (session.input && session.input.title))) || result.title || '').trim(),
    author: String(articleMeta.author || (result.articleMeta && result.articleMeta.author) || result.authorName || (session ? extractSiteAuthorFromInput(session.input) : '') || '').trim(),
  };
}

  if (options.rerender !== false && window._engineApi && typeof window._engineApi.setArticleStrategy === 'function') {
    window._engineApi.setArticleStrategy(next === 'repost');
  }
}

  setSiteStrategyFromInput(restoredInput, cs.is_repost);
});

await restoreCurrentChannel();

{
  const shareButton = document.getElementById('ftShareButton');
  const sharePopover = document.getElementById('ftSharePopover');
  const shareCopyButton = document.getElementById('ftShareCopyText');
  function setShareOpen(open) {
    if (!shareButton || !sharePopover) return;
    shareButton.setAttribute('aria-expanded', open ? 'true' : 'false');
    sharePopover.hidden = !open;
  }
  if (shareButton && sharePopover) {
    shareButton.addEventListener('click', event => {
      event.stopPropagation();
      setShareOpen(sharePopover.hidden);
    });
    sharePopover.addEventListener('click', event => event.stopPropagation());
    document.addEventListener('click', () => setShareOpen(false));
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape') setShareOpen(false);
    });
  }
  if (shareCopyButton) {
    shareCopyButton.addEventListener('click', async () => {
      const text = window._currentArticleUrl || location.href;
      try {
        await navigator.clipboard.writeText(text);
        shareCopyButton.textContent = '已复制';
        window.setTimeout(() => { shareCopyButton.textContent = FOODTALKS_PREVIEW_META.shareCopyText; }, 1200);
      } catch {
        shareCopyButton.textContent = FOODTALKS_PREVIEW_META.shareCopyText;
      }
    });
  }
}

// ---- Wrap engine functions for split layout ----
function wrapEngineFunctions() {
  wrapCopyFeedback({ windowRef: window, documentRef: document, pasteTargets: pasteTargetsForChannel('ft') });
  wrapBackFeedback({ windowRef: window, documentRef: document });
  mountCopySplitButton({ windowRef: window, documentRef: document });
}

// ---- URL repost ----
const importClipboardText = (text) => {
  window._currentArticleUrl = '';
  if (window._handleText) {
    resetSiteArticleMetaForNewInput('original');
    window._handleText(text, { source: 'clipboard' });
  }
};
const clearRenderedImport = () => {
  if (window.fetchArticle && typeof window.fetchArticle.invalidate === 'function') window.fetchArticle.invalidate();
  clearSiteImportCompact();
  if (window._sessionRestore && typeof window._sessionRestore.clearCurrent === 'function') {
    window._sessionRestore.clearCurrent();
  }
  if (window.goBack) window.goBack();
};
window.fetchArticle = createUrlImportHandler({
  documentRef: document,
  fetchImpl: fetch,
  getAccountID: () => activeRulePack.id,
  errorMessage: foodTalksFetchErrorMessage,
  importText: importClipboardText,
  onArticleIntent() {
    if (window._engineApi && typeof window._engineApi.invalidatePendingWork === 'function') window._engineApi.invalidatePendingWork();
  },
  resolveIsRepost(payload) {
    if (hasExplicitRepostDisclosure(payload && payload.blocks)) return true;
    const sourceName = String(payload && payload.source_name || '').replace(/\s+/g, '').toLowerCase();
    const ownedName = String(activeRulePack && activeRulePack.previewAccountName || '').replace(/\s+/g, '').toLowerCase();
    return !sourceName || !ownedName || sourceName !== ownedName;
  },
  onArticleUrl(url, meta = {}) {
    window._currentArticleUrl = url;
    setSiteImportCompact('FoodTalks 链接', url);
    setSiteStrategy(meta.isRepost === false ? 'original' : 'repost', { rerender: false });
  },
  // 摘要自动填充（飞书反馈问题七）：原文开头短导语 → 预览【摘要】框，并从正文流移除
  // （62139 成品：摘要句不在正文重复）。提取不到合适导语时保持占位，由编辑自填。
  onBlocks(blocks) {
    const summary = extractSiteSummary(blocks, { consume: true });
    pendingUrlSummary = summary;
  },
});
window.addEventListener('fbif:article-input-started', event => {
  if (event && event.detail && event.detail.origin === 'url-import') return;
  if (window.fetchArticle && typeof window.fetchArticle.invalidate === 'function') window.fetchArticle.invalidate();
});

// ---- Keyboard shortcuts ----
bindUrlImportShortcuts({
  documentRef: document,
  fetchArticle: () => window.fetchArticle(),
  importText: importClipboardText,
  onInputCleared: clearRenderedImport,
  ignoreClassNames: ['ma-url'], focusTargetSelector: '[data-url-focus-target]',
});

document.addEventListener('click', event => {
  if (event.target && event.target.closest && event.target.closest('[data-remove-upload]')) {
    clearSiteImportCompact();
  }
}, true);

(() => {
  const toggle = document.getElementById('footerEnableToggle'), presetsEl = document.getElementById('footerPresets'), segsEl = document.getElementById('footerSegments'), offNote = document.getElementById('footerOffNote');
  if (!toggle || !presetsEl || !segsEl) return;
  const state = readFooterState();
  const presetList = state.presets;
  const PRESETS = Object.fromEntries(presetList.map(p => [p.id, p.segments || {}]));
  let order = state.order;
  let enabled = true;
  let segments = state.segments;

  function bdCardSelectHtml(key) {
    if (key !== 'bd_card') return '';
    const assets = footerBdCardAssets();
    if (footerBdCardAssetID && !assets.some(asset => asset.id === footerBdCardAssetID)) footerBdCardAssetID = '';
    if (!assets.length) return '';
    return `<div class="ft-footer-bd-control">
      <select class="ft-footer-bd-select" data-bd-card-select aria-label="选择 BD 名片">
        <option value="" ${footerBdCardAssetID ? '' : 'selected'}>按规则默认</option>
        ${assets.map(asset => `<option value="${escText(asset.id)}" ${asset.id === footerBdCardAssetID ? 'selected' : ''}>${escText(asset.label || asset.id)}</option>`).join('')}
      </select>
      <div class="ft-footer-bd-preview" data-bd-card-preview hidden></div>
    </div>`;
  }

  function footerSegmentNeedsDetail(key) {
    return key === 'bd_card' || !!footerSegmentAssetToken(key);
  }

  function segmentRowHtml(key) {
    const assetControl = footerSegmentAssetControlHtml(key);
    const bdControl = bdCardSelectHtml(key);
    return `<div class="ft-footer-seg-row ${footerSegmentNeedsDetail(key) ? '' : 'ft-footer-seg-row--compact'}" role="listitem" data-seg-row="${escText(key)}" draggable="${key === 'tip' ? 'false' : 'true'}">
      <div class="ft-footer-cell ft-footer-cell-module">
        <span class="ft-footer-drag-slot" data-footer-drag-slot>${key === 'tip' ? '' : `<span class="ft-footer-drag-handle" data-footer-drag-handle aria-label="拖拽排序${escText(footerSegmentLabel(key))}" title="拖拽排序"></span>`}</span>
        <span class="ft-footer-seg-title">${escText(footerSegmentLabel(key))}</span>
      </div>
      <div class="ft-footer-cell ft-footer-cell-preview">${footerSegmentPreviewHtml(key)}</div>
      <div class="ft-footer-cell ft-footer-cell-status">
        <button type="button" class="ft-switch" data-footer-seg="${escText(key)}" role="switch" aria-checked="false" aria-label="显示${escText(footerSegmentLabel(key))}">
          <span class="ft-switch-knob"></span>
        </button>
      </div>
      <div class="ft-footer-cell ft-footer-cell-actions">${assetControl || bdControl || ''}</div>
    </div>`;
  }

  function hydrateFooterDragHandles() {
    segsEl.querySelectorAll('[data-footer-drag-handle]').forEach(handle => {
      if (handle.firstChild) return;
      const icon = createIcon('gripVertical');
      icon.className = 'ft-footer-drag-icon';
      handle.appendChild(icon);
    });
  }

  function renderControls() {
    presetsEl.innerHTML = presetList.map(p => `<button type="button" class="ft-footer-preset" data-preset="${escText(p.id)}">${escText(p.name || p.id)}</button>`).join('');
    segsEl.innerHTML = order.map(segmentRowHtml).join('');
    hydrateFooterDragHandles();
  }
  renderControls();
  refreshFooterControls = () => { renderControls(); paint(); };

  const segmentSwitches = () => Array.from(segsEl.querySelectorAll('[data-footer-seg][role="switch"]'));
  const segmentKeys = () => order.slice();
  function isEmptyFooterPreset(segs) {
    return segmentKeys().every(k => !segs || !segs[k]);
  }
  function matchPreset() {
    if (!enabled && PRESETS.none && isEmptyFooterPreset(PRESETS.none)) return 'none';
    for (const [id, segs] of Object.entries(PRESETS)) if (segmentKeys().every(k => !!segments[k] === !!segs[k])) return id;
    return null;
  }
  function paint() {
    toggle.setAttribute('aria-checked', enabled ? 'true' : 'false');
    segsEl.classList.toggle('ft-footer-disabled', !enabled);
    if (offNote) offNote.hidden = enabled;
    const active = matchPreset();
    presetsEl.querySelectorAll('.ft-footer-preset').forEach(b => b.classList.toggle('active', b.dataset.preset === active));
    segmentSwitches().forEach(btn => {
      const key = btn.dataset.footerSeg;
      const checked = !!segments[key];
      btn.setAttribute('aria-checked', checked ? 'true' : 'false');
      btn.disabled = !enabled;
      btn.setAttribute('aria-disabled', enabled ? 'false' : 'true');
    });
    const bdSelect = segsEl.querySelector('[data-bd-card-select]');
    if (bdSelect) {
      bdSelect.value = footerBdCardAssetID;
      bdSelect.disabled = !enabled || !segments.bd_card;
    }
    const bdPreview = segsEl.querySelector('[data-bd-card-preview]');
    const bdAsset = footerSelectedBdCardAsset();
    if (bdPreview) {
      if (bdAsset && bdAsset.url) {
        bdPreview.innerHTML = `<img src="${escText(bdAsset.url)}" alt="${escText(bdAsset.label || 'BD名片预览')}" loading="lazy">`;
        bdPreview.hidden = false;
        bdPreview.classList.toggle('disabled', !enabled || !segments.bd_card);
      } else {
        bdPreview.innerHTML = '';
        bdPreview.hidden = true;
      }
    }
    segsEl.querySelectorAll('[data-footer-asset-pick], [data-footer-asset-reset]').forEach(btn => {
      const key = btn.dataset.footerAssetPick || btn.dataset.footerAssetReset;
      btn.disabled = !enabled || !segments[key];
    });
    segsEl.querySelectorAll('[data-footer-asset-control]').forEach(control => {
      const key = control.dataset.footerAssetControl;
      control.classList.toggle('disabled', !enabled || !segments[key]);
    });
  }
  function persist(rerender) {
    saveFooterPanelState({
      storage: localStorage,
      accountId: activeRulePack.id,
      footerLib: serverFooterLibrary(),
      enabled,
      segments,
      order,
      fields: footerSegmentFields,
    });
    syncEngineConfig(rerender);
  }
  saveFooterArticleOverrideState = () => {
    saveFooterPanelState({
      storage: localStorage,
      accountId: activeRulePack.id,
      footerLib: serverFooterLibrary(),
      enabled,
      segments,
      order,
      fields: footerSegmentFields,
    });
  };

  paint();
  syncEngineConfig(false);

  toggle.addEventListener('click', (e) => {
    e.preventDefault();
    e.stopPropagation();
    enabled = toggle.getAttribute('aria-checked') !== 'true';
    if (enabled && !segmentKeys().some(k => segments[k])) segments = { ...((activeFooterPreset(serverFooterLibrary()) || {}).segments || {}) };
    paint(); persist(true);
  });
  presetsEl.addEventListener('click', e => {
    const btn = e.target.closest('.ft-footer-preset');
    if (!btn) return;
    const nextSegments = { ...(PRESETS[btn.dataset.preset] || {}) };
    enabled = !isEmptyFooterPreset(nextSegments);
    segments = nextSegments;
    paint(); persist(true);
  });
  segsEl.addEventListener('click', (e) => {
    const pickBtn = e.target.closest('[data-footer-asset-pick]');
    if (pickBtn && !pickBtn.disabled) {
      const key = pickBtn.dataset.footerAssetPick;
      openAssetPicker({
        assetLibrary: serverAssetLibrary(),
        scope: 'ft-default',
        doc: document,
        onPick(assetID) {
          const defaultLines = footerSegmentDefaultHtmlLines(key);
          if (!defaultLines.length) return;
          const nextLines = replaceFooterSegmentAssetRef(defaultLines, assetID);
          if (String(assetID || '') === footerSegmentDefaultAssetID(key) || sameFooterHtmlLines(nextLines, defaultLines)) {
            delete footerSegmentFields[key];
          } else {
            footerSegmentFields[key] = {
              ...(footerSegmentFields[key] || {}),
              html_lines: nextLines,
            };
          }
          enabled = true;
          segments[key] = 1;
          renderControls(); paint(); persist(true);
        },
      });
      return;
    }

    const resetBtn = e.target.closest('[data-footer-asset-reset]');
    if (resetBtn && !resetBtn.disabled) {
      const key = resetBtn.dataset.footerAssetReset;
      delete footerSegmentFields[key];
      renderControls(); paint(); persist(true);
      return;
    }

    const btn = e.target.closest('[data-footer-seg][role="switch"]');
    if (!btn || btn.disabled) return;
    const key = btn.dataset.footerSeg;
    segments[key] = btn.getAttribute('aria-checked') === 'true' ? 0 : 1;
    paint(); persist(true);
  });
  segsEl.addEventListener('change', (e) => {
    const bdSelect = e.target.closest('[data-bd-card-select]');
    if (bdSelect) {
      footerBdCardAssetID = bdSelect.value || '';
      if (footerBdCardAssetID) {
        enabled = true;
        segments.bd_card = 1;
      }
      paint(); persist(true);
      return;
    }
  });
  let dragging = '';
  segsEl.addEventListener('dragstart', e => { const row = e.target.closest('[data-seg-row]'); dragging = row && row.dataset.segRow || ''; });
  segsEl.addEventListener('dragover', e => { if (dragging && e.target.closest('[data-seg-row]')) e.preventDefault(); });
  segsEl.addEventListener('drop', e => {
    const row = e.target.closest('[data-seg-row]');
    if (!row || !dragging || dragging === row.dataset.segRow) return;
    e.preventDefault();
    const from = order.indexOf(dragging), to = order.indexOf(row.dataset.segRow);
    if (from >= 0 && to >= 0) order.splice(to, 0, order.splice(from, 1)[0]);
    renderControls(); paint(); persist(true);
  });
})();
</script>
<script type="module" src="/js/app-shell-ui.js"></script>
</body>
