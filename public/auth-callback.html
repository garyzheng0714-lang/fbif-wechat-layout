<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>正在完成登录 · FBIF</title>
  <style>
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      margin: 0;
      background: #e4e9f0;
      color: #646a73;
      font: 14px/1.6 "PingFang SC", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
  </style>
</head>
<body>
  <p>正在完成登录…</p>
  <script type="module">
    import { storeSessionToken } from '/js/auth-session.js';
    const params = new URLSearchParams(location.hash.slice(1));
    const token = params.get('session_token') || '';
    const rawReturnTo = params.get('return_to') || '/mp/fbif';
    const returnTo = rawReturnTo.startsWith('/') &&
      !rawReturnTo.startsWith('//') &&
      !/[\\\r\n]/.test(rawReturnTo)
      ? rawReturnTo
      : '/mp/fbif';
    if (!token) {
      location.replace('/login.html?error=feishu_login_failed');
    } else {
      storeSessionToken(token);
      history.replaceState(null, '', '/auth-callback.html');
      location.replace(returnTo);
    }
  </script>
</body>
</html>
