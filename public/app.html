<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FBIF 微信排版工具</title>
<link rel="icon" type="image/png" href="/fbif-logo.png">

<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5/500.css" crossorigin="anonymous">

<body>

<header class="global-channel-bar">
  <div class="channel-bar-side channel-bar-side-left" aria-hidden="true"></div>
  <nav class="channel-switcher" role="tablist" aria-label="选择渠道">
    <a href="/mp/fbif" class="channel-switcher-btn is-active" data-channel="mp" role="tab" aria-selected="true" aria-current="page">
      <img class="channel-switcher-icon" src="/wechat-logo.svg" alt="" aria-hidden="true">
      <span>公众号</span>
    </a>
    <button type="button" class="channel-switcher-btn is-disabled" data-channel="ft" role="tab" aria-selected="false" aria-disabled="true" disabled title="维护中">
      <img class="channel-switcher-icon" src="/foodtalks-logo.svg" alt="" aria-hidden="true">
      <span>FoodTalks 网站</span>
    </button>
  </nav>
  <div class="channel-bar-side channel-bar-side-right">
    <img class="channel-bar-logo" src="/fbif-logo.png" alt="FBIF">
    <span class="channel-bar-title">微信排版工具</span>
  </div>
</header>

<div class="app-layout">
  <!-- ======== Sidebar ======== -->
  <aside class="sidebar">
    <div class="sidebar-body">
      <!-- Hidden compat for engine.js -->
      <span id="pageTitle" style="display:none;"></span>
      <span id="pageSubtitle" style="display:none;"></span>

      <div class="account-switcher" id="accountSwitcher" aria-label="规则包选择"></div>

      <div class="upload-zone" id="dropZone">

        <div class="upload-text">点击或拖拽文件</div>
        <div class="upload-hint" id="fileHint">支持 .docx、.md、.txt</div>
        <input type="file" id="fileInput">
      </div>
      <div class="url-row-inline">
        <input type="url" id="urlInput" class="url-input-inline" placeholder="公众号文章链接">
        <button id="urlFetchBtn" class="url-btn-inline" onclick="fetchArticle()">提取</button>

      <div class="progress" id="progress">

      <div class="error" id="error"></div>
      <div class="sidebar-stats" id="statsBar"></div>
      <div class="batch-list" id="batchList" style="display:none;"></div>

      <div class="ma-section" id="moreArticlesSection">
        <div class="sidebar-divider"></div>
        <div class="sidebar-label ma-section-label">
          <span>更多文章</span>
          <button class="ma-reset-btn" id="maResetBtn" type="button" title="清空所有卡片">清空</button>
        </div>
        <div class="more-articles-editor" id="moreArticlesEditor">

        <div class="ma-hint" id="maHint">粘贴公众号链接自动抓取头图和标题。拖动卡片可重排顺序。</div>

      <div class="active-rule-card" id="activeRuleCard" aria-live="polite">
        <div class="active-rule-readline">

            <span class="active-rule-label">规则</span>

          </button>
        </div>
      </div>
    </div>
    <div class="sidebar-footer">
      <a href="https://mp.weixin.qq.com" target="_blank" class="mp-link">微信公众号后台 →</a>

<!-- Hidden compat elements for engine.js -->
<input type="hidden" id="titleInput" value="">
<span id="previewTitleDisplay" style="display:none;"></span>
<input type="checkbox" id="footerEnabled" checked style="display:none;">
<span id="zoomLabel" style="display:none;">200%</span>

<script type="module">
// ---- Version ----
async function loadVersionInfo() {
  try { const r = await fetch('/version.json?ts=' + Date.now(), { cache: 'no-store' }); if (r.ok) return await r.json(); } catch {}
  return { build: 'runtime-' + Date.now() };
}
const versionInfo = await loadVersionInfo();
const buildId = String(versionInfo.build || versionInfo.commit || Date.now());
const assetVersion = encodeURIComponent(buildId);
window.__APP_BUILD_INFO = versionInfo;
if (!new URLSearchParams(location.search).get('v')) {
  const next = new URL(location.href); next.searchParams.set('v', buildId); history.replaceState(null, '', next);
}
async function reloadIfUpdated() {
  try { const latest = await loadVersionInfo(); if (String(latest.build || latest.commit || '') !== buildId) location.reload(); } catch {}
}
window.addEventListener('focus', reloadIfUpdated);
document.addEventListener('visibilitychange', () => { if (!document.hidden) reloadIfUpdated(); });

// ---- Log ----
window._pushLog = function(level, msg, detail) {
  console.log('[FBIF]', level === 'error' ? '!' : '+', msg, detail || '');
};

// ---- Rule preset config ----
const rulePackModule = await import('/js/rule-packs/registry.js?v=' + assetVersion);
const rulePackUrlModule = await import('/js/rule-packs/url.js?v=' + assetVersion);
const ACCOUNT_STORAGE_KEY = 'active_rule_pack';

function storedRulePackID() {
  try {
    return window.localStorage.getItem(ACCOUNT_STORAGE_KEY) || '';
  } catch {
    return '';
  }
}

function initialRulePackID() {
  // 优先级：URL 路径 (/mp/fbif) > query (?account=) > localStorage > 默认
  const parsed = rulePackUrlModule.parsePath(location.pathname);
  if (parsed && parsed.packId) {
    return parsed.packId;
  }
  const storedID = storedRulePackID();
  return rulePackModule.getRulePackIDFromLocation({
    search: location.search || (storedID ? '?account=' + storedID : ''),
  });
}

let activeRulePack = rulePackModule.getRulePack(initialRulePackID());
window._activeRulePack = activeRulePack;
let currentTemplateId = activeRulePack.templateId;
const ruleModule = await import('/js/rule-presets.js?v=' + assetVersion);
const {
  loadActiveRulePreset,
  loadLocalRuleConfig,
  saveLocalRuleConfig,
  applyActiveRuleConfig,
  adminLogin,
  listPublicRulePresets,
  normalizeRuleConfig,
  setActiveRulePreset,
} = ruleModule;
const initialRule = await loadActiveRulePreset(activeRulePack.id);
let activeRuleSource = initialRule.source;
applyActiveRuleConfig(initialRule.preset.config, initialRule.preset);
if (activeRuleSource === 'server') {
  // Cache the server rule only as the offline fallback. Online edits below stay
  // session-only unless the rule backend is unavailable.
  saveLocalRuleConfig(initialRule.preset.config, activeRulePack.id);
}
let activeRuleCatalog = await loadRuleCatalog();
let activeRuleSelectorEditing = false;
let activeRuleSelectorOpen = false;
let activeRuleSelectorDraftID = initialRule.preset.id || 'default';
let activeRuleSelectorStatus = '';
let activeRuleAdminPassword = '';
let activeRuleOutsideHandler = null;

function escText(value) {
  return String(value == null ? '' : value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function renderActiveRuleCard() {
  const card = document.getElementById('activeRuleCard');
  if (!card) return;
  const preset = (window._activeConfig && window._activeConfig.preset) || {};
  const currentID = preset.id || 'default';
  const selectedID = activeRuleSelectorEditing ? (activeRuleSelectorDraftID || currentID) : currentID;
  const options = ruleSelectorOptions(preset);
  const selectedRule = options.find(rule => rule.id === selectedID) || options[0];
  const canSave = activeRuleSelectorEditing && selectedID && selectedID !== currentID;
  const statusHTML = activeRuleSelectorStatus ? `<div class="active-rule-status">${escText(activeRuleSelectorStatus)}</div>` : '';
  const ruleName = escText(selectedRule.name || selectedRule.id);
  const menuHTML = activeRuleSelectorEditing && activeRuleSelectorOpen ? `
        <div class="active-rule-menu" id="activeRuleMenu" role="listbox" aria-label="当前规则">
          ${options.map(rule => `
            <button type="button" class="active-rule-option" role="option" aria-selected="${rule.id === selectedID ? 'true' : 'false'}" data-rule-option="${escText(rule.id)}">
              <span class="active-rule-option-name">${escText(rule.name || rule.id)}</span>
              <span class="active-rule-option-check" aria-hidden="true">✓</span>
            </button>
          `).join('')}
        </div>
      ` : '';
  card.className = 'active-rule-card' + (activeRuleSelectorEditing ? ' editing' : '') + (activeRuleSelectorOpen ? ' menu-open' : '');
  card.innerHTML = activeRuleSelectorEditing ? `
    <div class="active-rule-caption">
      <span class="active-rule-label">当前规则</span>
      <span class="active-rule-badge">编辑中</span>
    </div>
    <div class="active-rule-line">
      <span class="active-rule-select-wrap">
        <button type="button" id="activeRuleSelect" class="active-rule-trigger" data-value="${escText(selectedRule.id)}" aria-haspopup="listbox" aria-expanded="${activeRuleSelectorOpen ? 'true' : 'false'}" ${activeRuleSelectorEditing ? '' : 'disabled'}>
          <span class="active-rule-value">${ruleName}</span>
        </button>
        <svg class="active-rule-chevron" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        ${menuHTML}
      </span>
      <button type="button" class="active-rule-save" data-action="save-active-rule" ${canSave ? '' : 'disabled'}>保存</button>
      <button type="button" class="active-rule-cancel" data-action="cancel-active-rule">取消</button>
    </div>
    ${statusHTML}
  ` : `
    <div class="active-rule-readline">
      <span class="active-rule-readmeta">
        <span class="active-rule-label">规则</span>
        <span class="active-rule-readvalue">${ruleName}</span>
        <span class="active-rule-badge">已锁定</span>
      </span>
      <button type="button" class="active-rule-icon" data-action="edit-active-rule" aria-label="修改当前规则" title="修改当前规则">
        <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M4 20h4l11-11a2.8 2.8 0 0 0-4-4L4 16v4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M13.5 6.5l4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </div>
    ${statusHTML}
  `;
  const trigger = card.querySelector('#activeRuleSelect');
  if (trigger) {
    trigger.addEventListener('click', () => toggleActiveRuleMenu());
    trigger.addEventListener('keydown', event => {
      if (!activeRuleSelectorEditing) return;
      if (event.key === 'Enter' || event.key === ' ' || event.key === 'ArrowDown') {
        event.preventDefault();
        activeRuleSelectorOpen = true;
        activeRuleSelectorStatus = '';
        renderActiveRuleCard();
      }
      if (event.key === 'Escape') {
        activeRuleSelectorOpen = false;
        renderActiveRuleCard();
      }
    });
  }
  card.querySelectorAll('[data-rule-option]').forEach(button => {
    button.addEventListener('click', () => chooseActiveRuleOption(button.getAttribute('data-rule-option')));
    button.addEventListener('keydown', event => handleActiveRuleOptionKeydown(event, button));
  });
  const editButton = card.querySelector('[data-action="edit-active-rule"]');
  if (editButton) editButton.addEventListener('click', () => beginActiveRuleEdit());
  const saveButton = card.querySelector('[data-action="save-active-rule"]');
  if (saveButton) saveButton.addEventListener('click', () => saveActiveRuleSelection());
  const cancelButton = card.querySelector('[data-action="cancel-active-rule"]');
  if (cancelButton) cancelButton.addEventListener('click', () => cancelActiveRuleEdit());
  syncActiveRuleOutsideHandler(card);
  if (activeRuleSelectorOpen) {
    const selectedOption = card.querySelector('[data-rule-option][aria-selected="true"]');
    if (selectedOption) selectedOption.focus();
  }
}

async function loadRuleCatalog() {
  try {
    const data = await listPublicRulePresets();
    return { presets: Array.isArray(data.presets) ? data.presets : [] };
  } catch {
    const preset = (window._activeConfig && window._activeConfig.preset) || {};
    return { presets: preset.id ? [{ id: preset.id, name: preset.name || preset.id }] : [] };
  }
}

function ruleSelectorOptions(currentPreset) {
  const seen = new Set();
  const rules = [];
  for (const rule of activeRuleCatalog.presets || []) {
    if (!rule || !rule.id || seen.has(rule.id)) continue;
    seen.add(rule.id);
    rules.push({ id: rule.id, name: rule.name || rule.id });
  }
  if (currentPreset && currentPreset.id && !seen.has(currentPreset.id)) {
    rules.unshift({ id: currentPreset.id, name: currentPreset.name || currentPreset.id });
  }
  return rules.length ? rules : [{ id: 'default', name: '默认规则' }];
}

function clearActiveRuleOutsideHandler() {
  if (!activeRuleOutsideHandler) return;
  document.removeEventListener('pointerdown', activeRuleOutsideHandler);
  activeRuleOutsideHandler = null;
}

function syncActiveRuleOutsideHandler(card) {
  clearActiveRuleOutsideHandler();
  if (!activeRuleSelectorOpen) return;
  activeRuleOutsideHandler = event => {
    if (card.contains(event.target)) return;
    activeRuleSelectorOpen = false;
    renderActiveRuleCard();
  };
  setTimeout(() => document.addEventListener('pointerdown', activeRuleOutsideHandler), 0);
}

function toggleActiveRuleMenu() {
  if (!activeRuleSelectorEditing) return;
  activeRuleSelectorOpen = !activeRuleSelectorOpen;
  activeRuleSelectorStatus = '';
  renderActiveRuleCard();
}

function chooseActiveRuleOption(ruleID) {
  if (!ruleID) return;
  activeRuleSelectorDraftID = ruleID;
  activeRuleSelectorOpen = false;
  activeRuleSelectorStatus = '';
  renderActiveRuleCard();
}

function handleActiveRuleOptionKeydown(event, currentButton) {
  const options = Array.from(document.querySelectorAll('[data-rule-option]'));
  const index = options.indexOf(currentButton);
  if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
    event.preventDefault();
    const direction = event.key === 'ArrowDown' ? 1 : -1;
    const next = options[(index + direction + options.length) % options.length];
    if (next) next.focus();
  }
  if (event.key === 'Enter' || event.key === ' ') {
    event.preventDefault();
    chooseActiveRuleOption(currentButton.getAttribute('data-rule-option'));
  }
  if (event.key === 'Escape') {
    event.preventDefault();
    activeRuleSelectorOpen = false;
    renderActiveRuleCard();
    const trigger = document.getElementById('activeRuleSelect');
    if (trigger) trigger.focus();
  }
}

async function beginActiveRuleEdit() {
  const preset = (window._activeConfig && window._activeConfig.preset) || {};
  activeRuleSelectorDraftID = preset.id || 'default';
  activeRuleSelectorStatus = '';
  activeRuleCatalog = await loadRuleCatalog();
  activeRuleSelectorEditing = true;
  activeRuleSelectorOpen = false;
  renderActiveRuleCard();
  const trigger = document.getElementById('activeRuleSelect');
  if (trigger) trigger.focus();
}

function cancelActiveRuleEdit() {
  const preset = (window._activeConfig && window._activeConfig.preset) || {};
  activeRuleSelectorDraftID = preset.id || 'default';
  activeRuleSelectorStatus = '';
  activeRuleSelectorEditing = false;
  activeRuleSelectorOpen = false;
  renderActiveRuleCard();
}

async function ensureRuleAdminPassword() {
  if (activeRuleAdminPassword) return activeRuleAdminPassword;
  const input = window.prompt('请输入规则后台密码');
  if (!input) throw new Error('需要规则后台密码');
  activeRuleAdminPassword = input.trim();
  await adminLogin(activeRuleAdminPassword);
  return activeRuleAdminPassword;
}

function refreshRuleConsumers() {
  syncWorkflowControls();
  renderActiveRuleCard();
  if (window.updateThemePreview) window.updateThemePreview(loadConfig());
  if (window._updateFooter) window._updateFooter(null);
  if (window._refreshMoreArticlesSidebar) window._refreshMoreArticlesSidebar();
  if (window._updateMoreArticles) window._updateMoreArticles().catch(() => {});
}

async function saveActiveRuleSelection() {
  const preset = (window._activeConfig && window._activeConfig.preset) || {};
  const nextID = activeRuleSelectorDraftID || preset.id || 'default';
  if (nextID === preset.id) {
    activeRuleSelectorEditing = false;
    activeRuleSelectorOpen = false;
    renderActiveRuleCard();
    return;
  }
  activeRuleSelectorStatus = '保存中...';
  activeRuleSelectorOpen = false;
  renderActiveRuleCard();
  try {
    const password = await ensureRuleAdminPassword();
    await setActiveRulePreset(password, nextID, activeRulePack.id);
    const loaded = await loadActiveRulePreset(activeRulePack.id);
    activeRuleSource = loaded.source;
    applyActiveRuleConfig(loaded.preset.config, loaded.preset);
    if (activeRuleSource === 'server') cacheServerRuleFallback(loaded.preset.config);
    activeRuleCatalog = await loadRuleCatalog();
    activeRuleSelectorEditing = false;
    activeRuleSelectorOpen = false;
    activeRuleSelectorDraftID = loaded.preset.id || nextID;
    activeRuleSelectorStatus = '已保存';
    refreshRuleConsumers();
  } catch (err) {
    if (/password|密码|401|unauthorized/i.test(String(err && err.message))) activeRuleAdminPassword = '';
    activeRuleSelectorStatus = err.message || '保存失败';
    renderActiveRuleCard();
  }
}

function applyRulePackChrome(pack) {
  const displayName = pack.previewAccountName || pack.accountName;
  document.querySelectorAll('.wx-meta-account').forEach(el => { el.textContent = displayName; });
  document.querySelectorAll('.wx-footer-name').forEach(el => { el.textContent = displayName; });
  document.querySelectorAll('.wx-avatar').forEach(el => {
    el.src = pack.avatarUrl;
    el.alt = displayName;
  });
  const locationEl = document.querySelector('.wx-meta .wx-meta-gray:last-child');
  if (locationEl) locationEl.textContent = pack.location || '上海';
}
applyRulePackChrome(activeRulePack);
renderActiveRuleCard();

function renderAccountSwitcher() {
  const root = document.getElementById('accountSwitcher');
  if (!root) return;
  root.innerHTML = rulePackModule.getRulePacksByChannel('mp').map(pack => `
    <button type="button" class="account-switcher-btn ${pack.id === activeRulePack.id ? 'active' : ''}" data-account-id="${pack.id}" aria-pressed="${pack.id === activeRulePack.id ? 'true' : 'false'}">
      <img class="account-switcher-icon" src="/wechat-logo.svg" alt="" aria-hidden="true">
      <span>${pack.accountName}</span>
    </button>
  `).join('');
  root.querySelectorAll('[data-account-id]').forEach(btn => {
    btn.addEventListener('click', () => switchAccount(btn.dataset.accountId));
  });
}

function persistAccountSelection(id) {
  try {
    window.localStorage.setItem(ACCOUNT_STORAGE_KEY, id);
  } catch {}
  const next = new URL(location.href);
  if (rulePackUrlModule.parsePath(location.pathname) !== null) {
    const pack = rulePackModule.getRulePack(id);
    next.pathname = rulePackUrlModule.buildPath(pack.channel, id);
    next.searchParams.delete('account');
  } else {
    next.searchParams.set('account', id);
  }
  history.replaceState(null, '', next);
}

async function switchAccount(accountID) {
  const nextPack = rulePackModule.getRulePack(accountID);
  if (nextPack.id === activeRulePack.id) return;
  if (nextPack.templateId !== currentTemplateId) {
    const next = new URL(location.href);
    if (rulePackUrlModule.parsePath(location.pathname) !== null) {
      next.pathname = rulePackUrlModule.buildPath(nextPack.channel, nextPack.id);
      next.searchParams.delete('account');
    } else {
      next.searchParams.set('account', nextPack.id);
    }
    location.href = next.toString();
    return;
  }
  activeRulePack = nextPack;
  window._activeRulePack = activeRulePack;
  persistAccountSelection(activeRulePack.id);
  applyRulePackChrome(activeRulePack);
  renderAccountSwitcher();

  const loaded = await loadActiveRulePreset(activeRulePack.id);
  activeRuleSource = loaded.source;
  applyActiveRuleConfig(loaded.preset.config, loaded.preset);
  if (activeRuleSource === 'server') {
    saveLocalRuleConfig(loaded.preset.config, activeRulePack.id);
  }
  activeRuleCatalog = await loadRuleCatalog();
  activeRuleSelectorEditing = false;
  activeRuleSelectorOpen = false;
  activeRuleSelectorDraftID = loaded.preset.id || 'default';
  activeRuleSelectorStatus = '';
  refreshRuleConsumers();
}

renderAccountSwitcher();

function loadConfig() {
  return normalizeRuleConfig((window._activeConfig && window._activeConfig.config) || loadLocalRuleConfig(activeRulePack.id));
}

function cacheServerRuleFallback(config) {
  saveLocalRuleConfig(config, activeRulePack.id);
}

function saveConfig(config, preset, options = {}) {
  const normalized = normalizeRuleConfig(config);
  if (options.persistLocal || activeRuleSource !== 'server') {
    saveLocalRuleConfig(normalized, activeRulePack.id);
  }
  applyActiveRuleConfig(normalized, preset || (window._activeConfig && window._activeConfig.preset));
  refreshRuleConsumers();
  return normalized;
}

function syncWorkflowControls() {
  const c = loadConfig();
  const footerEl = document.getElementById('footerEnabled');
  if (footerEl) footerEl.checked = c.footer_enabled === true;
  window._skipUpload = c.skip_upload === true;
}

// ---- Load engine + template ----
const { initApp } = await import('/js/engine.js?v=' + assetVersion);
const { initMoreArticlesEditor } = await import('/js/more-articles-ui.js?v=' + assetVersion);
const { openCropEditor } = await import('/js/crop-editor.js?v=' + assetVersion);
initMoreArticlesEditor({ openCropEditor });

async function loadTemplate(templateId) {
  const cfg = loadConfig();
  saveConfig(cfg, null, { persistLocal: activeRuleSource !== 'server' });
  const mod = await import('/js/templates/' + templateId + '.js?v=' + assetVersion);
  initApp(mod.default);
  wrapEngineFunctions();
}

await loadTemplate(currentTemplateId);

// Cross-channel state restore — must come after initApp so engine.js has
// wired up window._captureSessionSnapshot / _restoreSessionSnapshot.
const { restoreCurrentChannel, bindChannelSwitcher } = await import('/js/session-restore.js?v=' + assetVersion);
restoreCurrentChannel();
bindChannelSwitcher();

syncWorkflowControls();
renderActiveRuleCard();

const { initAdminPanel } = await import('/js/admin-panel.js?v=' + assetVersion);
initAdminPanel({
  rulePacks: rulePackModule.getRulePacksByChannel('mp'),
  getConfig: loadConfig,
  getPreset: () => (window._activeConfig && window._activeConfig.preset) || null,
  onAuthenticated(password) {
    activeRuleAdminPassword = String(password || '').trim();
  },
  applyConfig(config, preset, meta = {}) {
    if (meta.source === 'server') {
      activeRuleSource = 'server';
      cacheServerRuleFallback(config);
    }
    const c = saveConfig(config, preset, { persistLocal: meta.persistLocal === true });
    if (window.updateThemePreview) window.updateThemePreview(c);
    if (window._updateFooter) window._updateFooter(null);
    if (window._refreshMoreArticlesSidebar) window._refreshMoreArticlesSidebar();
    if (window._updateMoreArticles) window._updateMoreArticles().catch(() => {});
    return c;
  },
});

// ---- Title display ----
const titleInput = document.getElementById('titleInput');
const articleTitle = document.getElementById('articleTitle');
const _od = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, 'value');
Object.defineProperty(titleInput, 'value', {
  get() { return _od.get.call(this); },
  set(v) { _od.set.call(this, v); articleTitle.textContent = v; },
});

// ---- Set date ----
{
  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth() + 1, d = now.getDate();
  const h = String(now.getHours()).padStart(2, '0'), mi = String(now.getMinutes()).padStart(2, '0');
  document.getElementById('wxDate').textContent = y + '年' + m + '月' + d + '日 ' + h + ':' + mi;
}

// ---- Wrap engine functions for split layout ----
function wrapEngineFunctions() {
  if (window.copyContent) {
    const origCopy = window.copyContent;
    window.copyContent = async function() {
      const btn = document.getElementById('copyBtn');
      const ok = await origCopy();
      if (ok === false) return;
      document.getElementById('copySuccess').style.display = 'block';
      setTimeout(() => {
        btn.textContent = '复制全文'; btn.classList.remove('copied');
        document.getElementById('copySuccess').style.display = 'none';
      }, 10000);
    };
  }
  if (window.goBack) {
    const origGoBack = window.goBack;
    window.goBack = function() {
      origGoBack();
      document.getElementById('copySuccess').style.display = 'none';
    };
  }
}

// ---- URL repost ----
window.fetchArticle = async function() {
  const urlInput = document.getElementById('urlInput');
  const btn = document.getElementById('urlFetchBtn');
  const errorEl = document.getElementById('error');
  const url = (urlInput.value || '').trim();
  if (!url) return;
  errorEl.style.display = 'none';
  btn.disabled = true; btn.textContent = '提取中...';
  try {
    const resp = await fetch('/api/fetch-article', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ url }) });
    if (!resp.ok) { const err = await resp.json().catch(() => ({ error: 'HTTP ' + resp.status })); throw new Error(err.error || '抓取失败'); }
    const payload = await resp.json();
    const { title, blocks, content } = payload;
    // Preferred: structured blocks from direct HTML parse. Preserves visual
    // signals (font-size/color/align/bold) so headings vs pullquotes vs
    // captions are classified deterministically — no lossy MD intermediate.
    if (Array.isArray(blocks) && blocks.length > 0) {
      if (!window._handleBlocks) throw new Error('blocks 路径未就绪');
      window._handleBlocks({ title, blocks }, { isRepost: true });
    } else if (content) {
      // Fallback: x-reader returned Markdown. Push it through the legacy
      // classifyMd pipeline via a synthetic File.
      const file = new File([content], (title || 'article') + '.md', { type: 'text/markdown' });
      if (window._handleFile) {
        window._handleFile(file, { isRepost: true });
      } else {
        const fi = document.getElementById('fileInput');
        const dt = new DataTransfer(); dt.items.add(file); fi.files = dt.files;
        fi.dispatchEvent(new Event('change'));
      }
    } else {
      throw new Error('文章内容为空');
    }
  } catch (e) { errorEl.textContent = '提取失败: ' + e.message; errorEl.style.display = 'block'; }
  finally { btn.disabled = false; btn.textContent = '提取'; }
};

// ---- Keyboard shortcuts ----
document.addEventListener('keydown', (e) => {
  const hasPreview = document.getElementById('previewContent').style.display !== 'none';
  if ((e.metaKey || e.ctrlKey) && e.key === 'Enter' && hasPreview) { e.preventDefault(); window.copyContent && window.copyContent(); }
});
document.addEventListener('paste', (e) => {
  const ae = document.activeElement;
  if (ae === document.getElementById('urlInput')) return;
  // Don't hijack pastes destined for the "更多文章" card URL inputs —
  // those have their own fetch flow.
  if (ae && ae.classList && ae.classList.contains('ma-url')) return;
  // Don't hijack pastes inside any other text input either.
  const tag = ae && ae.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA') return;
  const text = (e.clipboardData || window.clipboardData).getData('text').trim();
  if (text && /^https?:\/\//i.test(text)) {
    e.preventDefault();
    document.getElementById('urlInput').value = text;
    window.fetchArticle();
  }
});

// Paste directly into the URL input: auto-fetch without pressing Enter / 提取.
// setTimeout 0 waits for the browser to insert the pasted text as a task;
// a microtask would read .value === '' and silently skip.
(() => {
  const urlInput = document.getElementById('urlInput');
  if (!urlInput) return;
  urlInput.addEventListener('paste', () => {
    setTimeout(() => {
      const v = (urlInput.value || '').trim();
      if (/^https?:\/\//i.test(v)) window.fetchArticle();
    }, 0);
  });
  urlInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); window.fetchArticle(); }
  });
})();
</script>
