<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FBIF 文章排版工具</title>
<link rel="icon" type="image/png" href="/fbif-logo.png">
<script src="/vendor/jszip.min.js"></script>
<script src="/vendor/Sortable.min.js"></script>
<script src="/vendor/gsap.min.js"></script>
<script src="/vendor/Flip.min.js"></script>
<script src="/vendor/wangeditor/index.js"></script>
<link rel="stylesheet" href="/vendor/wangeditor/style.css">
<link rel="stylesheet" href="/css/feishu-tokens.css">
<link rel="stylesheet" href="/app.css">
<link rel="stylesheet" href="/css/channel-bar.css">
<link rel="stylesheet" href="/admin-panel.css">
<link rel="stylesheet" href="/css/rule-admin.css">
<link rel="stylesheet" href="/css/app-shell.css">
<link rel="stylesheet" href="/css/auth-editor.css">
<link rel="stylesheet" href="/css/wx-theme.css">
</head>
<body class="auth-pending">

<header class="global-channel-bar">
  <div class="topbar-spacer"></div>
  <div class="tb-actions preview-toolbar" id="previewToolbar">
    <button class="tb-retry" id="retryBtn" type="button" style="display:none;" onclick="window.retryUpload && window.retryUpload()">重试上传</button>
    <button class="btn btn-primary tb-primary" id="copyBtn" type="button" aria-label="复制全文" onclick="copyContent()">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
      <span>复制全文</span>
    </button>
  </div>
</header>

<div class="app-layout">
  <aside class="rail sidebar" id="rail" data-screen-label="左栏">
    <div class="rail-body sidebar-body scroll-y">
      <span id="pageTitle" style="display:none;"></span>
      <span id="pageSubtitle" style="display:none;"></span>
      <div class="import-zone" id="importZone">
        <div class="import-card">
          <div class="import-a11y-copy">
            <div class="import-description" id="importHelp">粘贴正文或文章链接，也可以上传文件或搜索飞书文档，系统会自动排版</div>
          </div>
          <div class="import-composer-shell">
            <div class="import-composer dropzone upload-zone" id="dropZone" role="group" aria-label="导入内容" aria-describedby="importHelp feishuDocCapability">
              <div class="import-destination">
                <span class="import-destination-label">排版到</span>
                <div class="acct-menu import-account-target" id="acctMenu" aria-label="选择排版公众号"></div>
              </div>
              <div class="import-composer-input" data-url-focus-target>
                <textarea class="field url-input-inline import-textarea" id="urlInput" rows="5" spellcheck="false" aria-label="粘贴文章链接、正文或 Markdown，或搜索飞书文档" placeholder="粘贴公众号文章 / 飞书文档链接，或正文"></textarea>
              </div>
              <div class="feishu-doc-selection" id="feishuDocSelection" role="status" aria-live="polite" hidden>
                <span class="feishu-doc-selection-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2h8l4 4v16H6z"/><path d="M14 2v5h5M9 12h6M9 16h6"/></svg></span>
                <span class="feishu-doc-selection-copy">
                  <strong id="feishuDocSelectionTitle">飞书文档</strong>
                  <span id="feishuDocSelectionStatus">正在准备导入…</span>
                </span>
                <button class="feishu-doc-selection-cancel" id="feishuDocSelectionCancel" type="button" aria-label="取消导入飞书文档">×</button>
              </div>
              <div class="feishu-doc-search" id="feishuDocSearch" hidden></div>
              <div class="dropzone-file" data-uploaded-file hidden>
                <span class="dropzone-file-icon" data-file-ext>T</span>
                <span class="dropzone-file-name" data-uploaded-name></span>
                <span class="dropzone-file-size" data-uploaded-size></span>
                <button class="dropzone-file-remove" type="button" data-remove-upload aria-label="移除已选择文件">
                  <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
                </button>
              </div>
              <div class="import-composer-addon">
                <div class="import-composer-actions">
                  <button class="import-action-button import-upload-trigger" id="uploadTrigger" type="button" data-upload-trigger aria-label="上传文件">
                    <span class="import-action-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 11.5 12 20a6 6 0 0 1-8.5-8.5l9-9a4 4 0 0 1 5.7 5.6l-9 9a2 2 0 1 1-2.9-2.8l8.4-8.4"/></svg></span>
                    <span class="import-action-label" data-add-file-text>上传文件</span>
                  </button>
                  <button class="import-action-button import-feishu-trigger" id="feishuDocTrigger" type="button" data-feishu-doc-trigger aria-label="搜索飞书云文档" aria-controls="feishuDocSearch" aria-expanded="false">
                    <span class="import-action-icon import-at-icon" aria-hidden="true">@</span>
                    <span class="import-action-label">飞书云文档</span>
                  </button>
                </div>
                <span class="import-composer-spacer"></span>
                <span class="feishu-doc-capability import-capability-status" id="feishuDocCapability">粘贴后自动排版</span>
              </div>
              <div class="progress import-progress" id="progress" role="progressbar" aria-label="导入总进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
                <div class="progress-status">
                  <span class="progress-text" id="progressText">正在排版...</span>
                  <strong class="progress-percent" id="progressPercent">0%</strong>
                </div>
              </div>
              <div class="dropzone-drag-prompt" data-upload-label aria-live="polite">
                <span class="dropzone-drag-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2h8l4 4v16H6z"/><path d="M14 2v5h5M12 11v7m-3-3 3 3 3-3"/></svg></span>
                <strong>松开导入</strong>
                <span>支持 Word / Markdown 文件</span>
              </div>
              <input type="file" id="fileInput">
            </div>
          </div>
        </div>
      </div>
      <div class="doc-zone" id="docZone" hidden>
        <div class="doc-card">
          <div class="doc-ico">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M8 13h8"/><path d="M8 17h5"/></svg>
          </div>
          <div class="doc-meta">
            <div class="doc-name" id="docName">未命名文档</div>
            <div class="doc-stat" id="docStat">已完成提取</div>
          </div>
          <button class="doc-swap" id="docSwap" type="button" title="重新上传" aria-label="重新上传">重新上传</button>
        </div>
        <div class="sidebar-stats" id="statsBar"></div>
      </div>

      <div class="error" id="error"></div>
      <div class="ma-section" id="moreArticlesSection" style="display:none;">
        <div id="moreArticlesEmbed">
          <!-- 这段会被 block-panel 摘进「更多文章」区块里，那里已经有区块标题，所以这里不再重复标题。 -->
          <div class="ma-embed-head">
            <button class="ma-reset-btn" id="maResetBtn" type="button" title="清空所有卡片">清空更多文章</button>
          </div>
          <div class="more-articles-editor" id="moreArticlesEditor">
            <!-- N card editors (dynamic, injected by more-articles-ui.js) -->
          </div>
          <div class="ma-hint" id="maHint">粘贴公众号链接自动抓取头图和标题。拖动卡片可重排顺序。</div>
        </div>
      </div>
      <div class="ma-section" id="blockPanelSection" style="display:none;">
        <div class="block-panel-mount" id="blockPanel"></div>
      </div>
    </div>

    <div class="rail-foot">
      <div class="user-identity rail-user-identity" id="userIdentity" aria-label="当前登录用户"></div>
    </div>
  </aside>

  <div class="rail-divider" id="railDivider" role="separator" aria-orientation="vertical" aria-label="调整左栏宽度">

    <div class="preview-scroll scroll-y" id="previewScroll">

        <div class="empty-ico">
          <svg viewBox="0 0 24 24" width="88" height="88" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/></svg>

<div class="toast-wrap" id="toastWrap"></div>
<input type="hidden" id="titleInput" value="">
<span id="previewTitleDisplay" style="display:none;"></span>
<input type="checkbox" id="footerEnabled" checked style="display:none;">
<span id="zoomLabel" style="display:none;">200%</span>

<script type="module">
const authSession = await import('/js/auth-session.js');
const authUser = await authSession.ensureAuthenticatedSession();
if (!authUser) await new Promise(() => {});
window.__AUTH_USER = authUser;
authSession.mountUserIdentity(document.getElementById('userIdentity'), authUser);

// ---- Version ----
async function loadVersionInfo() {
  try { const r = await fetch('/version.json?ts=' + Date.now(), { cache: 'no-store' }); if (r.ok) return await r.json(); } catch {}
  return { build: 'runtime-' + Date.now() };
}
const versionInfo = await loadVersionInfo();
const rawBuildId = String(versionInfo.build || versionInfo.commit || Date.now());
const isDevBuild = rawBuildId === 'dev';
const buildId = isDevBuild ? 'dev-' + Date.now() : rawBuildId;
const assetVersion = encodeURIComponent(buildId);
window.__APP_BUILD_INFO = { ...versionInfo, asset_version: buildId };
// <head> 里的 <link rel=stylesheet> 是裸 URL（无 ?v=），JS import 却都带 ?v=assetVersion。
// 于是部署后 JS 走新 URL 必然刷新，CSS 因 URL 不变、被浏览器/代理按旧缓存直接复用而变陈旧
// ——「导入区显示错乱」正是旧 CSS 卡住的表现。这里给同源 CSS 链接补上同一构建号：每次部署
// CSS 都是全新 URL（命中服务端 versioned 长缓存），旧缓存无法遮挡，与 JS 治理口径一致。
for (const link of document.querySelectorAll('link[rel="stylesheet"]')) {
  const href = link.getAttribute('href') || '';
  if (!href || /^https?:\/\//i.test(href) || href.includes('?')) continue;
  link.setAttribute('href', href + '?v=' + assetVersion);
}
const { installVersionRefresh, stripBuildVersionFromLocation } = await import('/js/version-refresh.js?v=' + assetVersion);
stripBuildVersionFromLocation();
installVersionRefresh({ currentBuildId: rawBuildId, isDevBuild, loadVersionInfo });
const { setRuleReadinessState } = await import('/js/rule-readiness.js?v=' + assetVersion);
window._setRuleReadinessState = setRuleReadinessState;
setRuleReadinessState('unresolved');

// ---- Log ----
window._pushLog = function(level, msg, detail) {
  console.log('[FBIF]', level === 'error' ? '!' : '+', msg, detail || '');
};

// ---- Rule preset config ----
const rulePackModule = await import('/js/rule-packs/registry.js?v=' + assetVersion);
const rulePackUrlModule = await import('/js/rule-packs/url.js?v=' + assetVersion);
const { mountAccountMenu } = await import('/js/account-menu.js?v=' + assetVersion);
const editorShell = await import('/js/editor-shell.js?v=' + assetVersion);
const { requestRulePreviewSync, rulePreviewCommitted } = await import('/js/rule-preview-sync.js?v=' + assetVersion);
const { mountBlockPanel } = await import('/js/blocks/block-panel.js?v=' + assetVersion);
const {
  bindRailDivider,
  bindUrlImportShortcuts,
  createUrlImportHandler,
  foreignChannelEditorPath,
  pasteTargetsForChannel,
  resolveInitialRulePackID,
  wrapBackFeedback,
  wrapCopyFeedback,
} = editorShell;
bindRailDivider();
const ACCOUNT_STORAGE_KEY = 'active_rule_pack';

function initialRulePackID() {
  return resolveInitialRulePackID({
    locationLike: location,
    storage: window.localStorage,
    storageKey: ACCOUNT_STORAGE_KEY,
    rulePackModule,
    rulePackUrlModule,
  });
}

let activeRulePack = rulePackModule.getRulePack(initialRulePackID());
const ownEditorPath = foreignChannelEditorPath(activeRulePack, 'mp', rulePackUrlModule);
if (ownEditorPath) {
  location.replace(ownEditorPath);
  await new Promise(() => {});
}
window._activeRulePack = activeRulePack;
let currentTemplateId = activeRulePack.templateId;
const ruleModule = await import('/js/rule-presets.js?v=' + assetVersion);
const {
  loadActiveRulePreset,
  loadLocalRuleConfig,
  saveLocalRuleConfig,
  applyActiveRuleConfig,
  listPublicRulePresets,
  normalizeRuleConfig,
  setActiveRulePreset,
} = ruleModule;

// 「当前规则」选择器：共享模块（架构体检 S1——此前这一族 ~17 个函数在 app/site 双份复制）。
// 公众号口径：只读态纯展示；server 预设落本地缓存走 structuredFallbackConfig；
// 水合后刷新账号能力 UI。
const { createActiveRuleSelector, escText } = await import('/js/active-rule-selector.js?v=' + assetVersion);
const ruleSelector = createActiveRuleSelector({
  documentRef: document,
  windowRef: window,
  getPack: () => activeRulePack,
  ruleModule,
  refreshRuleConsumers: (opts) => refreshRuleConsumers(opts),
  fallbackTransform: (config, preset) => structuredFallbackConfig(config, preset),
  afterHydrate: (pack) => applyAccountCapabilityUI(pack),
  readonlyLabel: '当前排版规则',
  readonlyEditEntry: false,
  initialSource: 'local',
  initialPresetID: 'local',
});
const {
  renderActiveRuleCard, hydrateActiveRulePreset, refreshActiveRuleCatalog,
  beginActiveRuleEdit, cancelActiveRuleEdit,
  cacheServerRuleFallback, localActiveRulePreset, loadRuleCatalog,
} = ruleSelector;

const initialRule = { source: 'local', preset: localActiveRulePreset(activeRulePack.id) };
applyActiveRuleConfig(initialRule.preset.config, initialRule.preset);
let activeRuleHydrationSeq = 0;
let accountSwitchGeneration = 0;
let committedAccountState = {
  pack: activeRulePack,
  templateId: currentTemplateId,
  activeConfig: window._activeConfig,
  skipUpload: window._skipUpload,
  bottomBlocksOverride: window._bottomBlocksOverride,
  ruleSource: ruleSelector.getSource(),
};

function trackActiveRuleHydration(promise, accountID = activeRulePack.id) {
  const seq = ++activeRuleHydrationSeq;
  window._activeRuleReady = false;
  setRuleReadinessState('loading');
  const tracked = Promise.resolve(promise).then(
    value => {
      if (seq === activeRuleHydrationSeq && accountID === activeRulePack.id) {
        window._activeRuleReady = true;
        const state = value && value.source === 'server' ? 'resolved' : 'stale-cache';
        setRuleReadinessState(state, { error: value && value.error });
        window.dispatchEvent(new CustomEvent('fbif:rules-ready', { detail: { accountId: accountID, state } }));
      }
      return value;
    },
    err => {
      if (seq === activeRuleHydrationSeq && accountID === activeRulePack.id) {
        window._activeRuleReady = true;
        setRuleReadinessState('failed', { error: err && err.message });
        window.dispatchEvent(new CustomEvent('fbif:rules-ready', { detail: { accountId: accountID, state: 'failed', failed: true } }));
      }
      throw err;
    }
  );
  window._activeRuleReadyPromise = tracked.catch(() => null);
  return tracked;
}

function syncEngineConfig(triggerRerender) {
  if (!window._engineApi || !window._engineApi.setActiveConfig) return { status: 'unavailable' };
  // 本篇底部区块覆盖（公众号 fbif.js 读 window._bottomBlocksOverride；面板写 bb.override::<acct>）。
  try { window._bottomBlocksOverride = JSON.parse(localStorage.getItem('bb.override::' + activeRulePack.id) || 'null') || undefined; } catch { window._bottomBlocksOverride = undefined; }
  const flat = loadConfig();
  const serverBehavior = (window._activeConfig && window._activeConfig.behavior) || {};
  window._engineApi.setActiveConfig({
    ...flat,
    behavior: serverBehavior,
  });
  return requestRulePreviewSync(window._engineApi, triggerRerender);
}

function refreshRuleConsumers(options = {}) {

  const finalize = result => {

    if (window.updateThemePreview) window.updateThemePreview(loadConfig());
    if (window._updateFooter) window._updateFooter(null);
    if (window._refreshMoreArticlesSidebar) window._refreshMoreArticlesSidebar();
    if (window._updateMoreArticles) window._updateMoreArticles().catch(() => {});
    // 当前账号已是最后提交态时，规则保存/水合也要同步回滚快照。
    // 切换中的目标账号与 committed pack 不同，不会误把暂存态提交。
    if (committedAccountState && committedAccountState.pack.id === activeRulePack.id) {
      committedAccountState = {
        pack: activeRulePack,
        templateId: currentTemplateId,
        activeConfig: window._activeConfig,
        skipUpload: window._skipUpload,
        bottomBlocksOverride: window._bottomBlocksOverride,
        ruleSource: typeof ruleSelector.getSource === 'function' ? ruleSelector.getSource() : null,
      };
    }
    return result;
  };
  return previewSync && typeof previewSync.then === 'function'
    ? previewSync.then(finalize)
    : finalize(previewSync);
}

async function switchAccount(accountID, options = {}) {
  if (window._accountSwitchFatal) {
    throw new Error('账号状态恢复失败，当前页面不可继续编辑，请刷新后重试');
  }
  const nextPack = rulePackModule.getRulePack(accountID);
  if (nextPack.id === activeRulePack.id) return;
  const generation = ++accountSwitchGeneration;
  if (window.fetchArticle && typeof window.fetchArticle.invalidate === 'function') window.fetchArticle.invalidate();
  if (window._feishuDocImport && typeof window._feishuDocImport.invalidate === 'function') window._feishuDocImport.invalidate();
  if (window._engineApi && typeof window._engineApi.invalidatePendingWork === 'function') window._engineApi.invalidatePendingWork();
  const rollbackState = committedAccountState;
  if (nextPack.channel !== rollbackState.pack.channel) {
    // 先暴露导航目标，让上一个同页切换的 selector 水合立即因账号不匹配失效。
    activeRulePack = nextPack;
    window._activeRulePack = nextPack;
    const next = new URL(location.href);
    if (rulePackUrlModule.parsePath(location.pathname) !== null) {
      next.pathname = rulePackUrlModule.buildPath(nextPack.channel, nextPack.id);
      next.searchParams.delete('account');
    } else {
      next.searchParams.set('account', nextPack.id);
    }
    next.searchParams.delete('v');
    try {
      location.href = next.toString();
    } catch (err) {
      activeRulePack = rollbackState.pack;
      window._activeRulePack = rollbackState.pack;
      throw err;
    }
    return;
  }
  const stale = () => generation !== accountSwitchGeneration || activeRulePack.id !== nextPack.id;
  // 水合期先让共享模块读到目标账号，但 URL / chrome / 菜单只在全链路
  // 成功后提交；任一步失败都回滚，同一账号可直接重试。
  activeRulePack = nextPack;
  window._activeRulePack = activeRulePack;
  // 整个跨模板+规则水合过程共用现有 rules-ready 门；不能只包住
  // adoptAccount，否则模板 import 期间上传文章会读到旧账号规则。
  const switching = (async () => {
    if (nextPack.templateId !== currentTemplateId) {
      const applied = await loadTemplate(nextPack.templateId, { rerender: false, stale });
      if (!applied || stale()) return { accountID: nextPack.id, stale: true };
    }
    if (stale()) return { accountID: nextPack.id, stale: true };
    // 水合+拉目录+复位选择器（含 afterHydrate 的账号能力 UI 刷新）收编进共享模块。
    const adopted = await ruleSelector.adoptAccount({ rerender: options.rerender !== false });
    if (stale() || (adopted && adopted.stale)) return { accountID: nextPack.id, stale: true };
    if (adopted && adopted.previewSync && !rulePreviewCommitted(adopted.previewSync)) {
      throw new Error('目标账号规则已加载，但当前文章预览未能提交；账号切换已回滚，请重试');
    }
    persistAccountSelection(nextPack.id);
    applyRulePackChrome(nextPack);
    accountMenu.setActive(nextPack.id);
    committedAccountState = {
      pack: nextPack,
      templateId: currentTemplateId,
      activeConfig: window._activeConfig,
      skipUpload: window._skipUpload,
      bottomBlocksOverride: window._bottomBlocksOverride,
      ruleSource: typeof ruleSelector.getSource === 'function' ? ruleSelector.getSource() : null,
    };
    return adopted;
  })();
  try {
    return await trackActiveRuleHydration(switching, nextPack.id);
  } catch (err) {
    if (generation === accountSwitchGeneration) {
      activeRulePack = rollbackState.pack;
      window._activeRulePack = rollbackState.pack;
      window._activeConfig = rollbackState.activeConfig;
      window._skipUpload = rollbackState.skipUpload;
      window._bottomBlocksOverride = rollbackState.bottomBlocksOverride;
      if (window._engineApi && typeof window._engineApi.invalidatePendingWork === 'function') window._engineApi.invalidatePendingWork();
      if (rollbackState.ruleSource != null && typeof ruleSelector.setSource === 'function') ruleSelector.setSource(rollbackState.ruleSource);
      // 无条件重投已提交模板：上一个过期切换可能已改了引擎，
      // 却还没来得及更新 currentTemplateId。
      const rollbackStale = () => generation !== accountSwitchGeneration || activeRulePack.id !== rollbackState.pack.id;
      let rollbackTemplateError = null;
      try {
        const restored = await loadTemplate(rollbackState.templateId, { rerender: false, stale: rollbackStale });
        if (!restored && !rollbackStale()) rollbackTemplateError = new Error('原模板未能恢复');
      } catch (rollbackErr) {
        rollbackTemplateError = rollbackErr;
      }
      if (rollbackStale()) throw err;
      if (rollbackTemplateError) {
        // 引擎实际模板已无法被可靠判定，此时继续刷新 A 规则/chrome/菜单只会
        // 制造“规则 A + 模板 B”混合态。立即锁页并回到已提交账号的 canonical URL。
        window._accountSwitchFatal = true;
        if (typeof document !== 'undefined' && document.body) document.body.inert = true;
        const canonical = new URL(location.href);
        if (rulePackUrlModule.parsePath(location.pathname) !== null) {
          canonical.pathname = rulePackUrlModule.buildPath(rollbackState.pack.channel, rollbackState.pack.id);
          canonical.searchParams.delete('account');
        } else {
          canonical.searchParams.set('account', rollbackState.pack.id);
        }
        canonical.searchParams.delete('v');
        try { location.href = canonical.toString(); } catch {}
        throw new Error(
          (err && err.message || '账号切换失败') +
          '；原账号模板回滚失败，已强制重新加载，当前页面不可继续编辑'
        );
      }
      let rollbackPreview = { status: 'not-requested' };
      let rollbackRestored = true;
      if (typeof refreshRuleConsumers === 'function') {
        try {
          rollbackPreview = await Promise.resolve(refreshRuleConsumers({ rerender: true }));
        } catch (rollbackErr) {
          rollbackPreview = { status: 'failed', error: String(rollbackErr && rollbackErr.message || rollbackErr) };
        }
        rollbackRestored = rulePreviewCommitted(rollbackPreview);
      } else {
        syncEngineConfig(false);
      }
      applyRulePackChrome(rollbackState.pack);
      accountMenu.setActive(rollbackState.pack.id);
      try { await applyAccountCapabilityUI(rollbackState.pack); } catch {}
      if (!rollbackRestored) {
        throw new Error((err && err.message || '账号切换失败') + '；原账号已回滚，但当前预览恢复失败，请重新导入文章');
      }
      const readinessSetter = window._setRuleReadinessState ||
        (typeof setRuleReadinessState === 'function' ? setRuleReadinessState : null);
      if (readinessSetter) readinessSetter(rollbackState.ruleSource === 'server' ? 'resolved' : 'stale-cache');
    }
    throw err;
  }
}

async function loadTemplate(templateId, options = {}) {
  const mod = await importTemplateModule(templateId);
  if (options.stale && options.stale()) return false;
  syncEngineConfig(false);
  if (window._engineApi && typeof window._engineApi.switchTemplate === 'function') {
    const switching = window._engineApi.switchTemplate(mod.default, { rerender: options.rerender === true });

    // 让后续切换能看见过期任务已经做过的模板变更。
    currentTemplateId = templateId;
    await switching;
  } else {
    initApp(mod.default);
    wrapEngineFunctions();
    currentTemplateId = templateId;
  }
  if (options.stale && options.stale()) return false;
  return true;
}

  fetchArticle: () => window.fetchArticle(),
  importText: importClipboardText,
  onInputCleared: clearRenderedImport,
  shouldSubmitValue: value => !value.trimStart().startsWith('@'),
  tryImportValue: value => feishuDocImport?.importValue?.(value) === true,
  ignoreClassNames: ['ma-url'], focusTargetSelector: '[data-url-focus-target]',
});

const {
  mountFeishuDocumentImport,
  createFeishuImportProgressTracker,
} = await import('/js/feishu-doc-import.js?v=' + assetVersion);
feishuDocImport = mountFeishuDocumentImport({
  user: authUser,
  getAccountID: () => activeRulePack.id,
  createProgressTracker: () => createFeishuImportProgressTracker({ documentRef: document }),
});
window._feishuDocImport = feishuDocImport;
</script>
<script type="module" src="/js/app-shell-ui.js"></script>
</body>
