<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>登录 · FBIF 文章排版工具</title>
  <link rel="icon" type="image/png" href="/fbif-logo.png">
  <link rel="preload" as="image" href="/assets/door-login.webp" media="(min-width: 1024px)">
  <link rel="preload" as="image" href="/assets/fbif-login-logo.png">
  <link rel="stylesheet" href="/css/auth-login.css?v=20260730-2">
</head>
<body>
  <main class="auth-login-page">
    <section class="auth-login-card" aria-label="FBIF 文章排版工具登录">
      <div class="auth-login-illustration" aria-hidden="true">
        <img src="/assets/door-login.webp" alt="" draggable="false" decoding="async">
      </div>
      <div class="auth-login-column">
        <div class="auth-login-form">
          <div class="auth-login-logo">
              <img src="/assets/fbif-login-logo.png" alt="FBIF" draggable="false">
          </div>

          <button class="auth-feishu-button" id="feishuLoginButton" type="button">
            <svg width="20" height="20" fill="none" viewBox="0 0 48 48" aria-hidden="true">
              <path d="M10 8c0 1 7 3.5 14.745 16.744 0 0 4.184-4.363 6.255-5.744 1.5-1 2.712-1.332 2.712-1.332C33.712 15.156 29.5 8 28 8z" fill="#00d6b9"/>
              <path d="M43.5 18.5c-1-.667-3.65-1.771-6.5-1.5a15 15 0 0 0-3.288.668S32.5 18 31 19c-2.07 1.38-6.255 5.744-6.255 5.744-1.428 1.397-3.05 2.732-5.245 3.756 0 0 7 3 11.5 3 5.063 0 7-3.5 7-3.5 1.5-3.305 3.5-7 5.5-9.5" fill="#163c9a"/>
              <path d="M4 17.5v17c0 1 6 5.5 15 5.5 10 0 17.05-7.705 19-12 0 0-1.937 3.5-7 3.5-4.5 0-11.5-3-11.5-3-5.117-2.239-10.03-6.577-12.906-9.117C4.974 17.953 4 17.093 4 17.5" fill="#3370ff"/>
            </svg>
            <span>使用飞书登录</span>
          </button>

          <div class="auth-login-divider"><span>或使用账号密码登录</span></div>

          <form id="passwordLoginForm" novalidate>
            <label class="auth-pill-field" for="loginUsername">
              <svg class="auth-field-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M20 21a8 8 0 0 0-16 0"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
              <span class="auth-sr-only">账号</span>
              <input id="loginUsername" name="username" type="text" placeholder="账号" autocomplete="username" required>
            </label>
            <label class="auth-pill-field auth-password-field" for="loginPassword">
              <svg class="auth-field-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect width="18" height="11" x="3" y="11" rx="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
              <span class="auth-sr-only">密码</span>
              <input id="loginPassword" name="password" type="password" placeholder="密码" autocomplete="current-password" required>
              <button class="auth-password-toggle" id="passwordVisibility" type="button" aria-label="显示密码" aria-pressed="false">
                <svg class="auth-eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M2.1 12a10.9 10.9 0 0 1 19.8 0 10.9 10.9 0 0 1-19.8 0"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
                <svg class="auth-eye-closed" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="m2 2 20 20"></path>
                  <path d="M6.7 6.7A10.7 10.7 0 0 0 2.1 12a10.9 10.9 0 0 0 17.2 5.3"></path>
                  <path d="M10.7 5.1A11.7 11.7 0 0 1 12 5c4.8 0 8.9 2.9 9.9 7a11.5 11.5 0 0 1-2.2 3.6"></path>
                  <path d="M14.1 14.1a3 3 0 0 1-4.2-4.2"></path>
                </svg>
              </button>
            </label>
            <div class="auth-account-options">
              <label class="auth-remember">
                <input id="rememberUsername" name="remember" type="checkbox" checked>
                <span>30 天内保持登录</span>
              </label>
              <button class="auth-text-action" type="button" data-account-help>忘记密码？</button>
            </div>
            <div class="auth-login-error" id="loginError" role="alert" hidden></div>
            <button class="auth-password-submit" id="passwordLoginButton" type="submit">登录</button>
          </form>

          <div class="auth-account-help" id="accountHelp" role="status" hidden>账号由管理员统一配置。需要开通账号或找回密码，请联系管理员协助处理。</div>
          <p class="auth-account-footer">还没有账号？<button class="auth-footer-action" type="button" data-account-help>联系开通</button></p>
          <p class="auth-login-caption">账号密码用户可以使用本地文件、正文和链接排版，但不能搜索、提取或生成飞书云文档。</p>
        </div>
      </div>
    </section>
  </main>
  <script type="module" src="/js/login.js?v=20260730-2"></script>
</body>
</html>
