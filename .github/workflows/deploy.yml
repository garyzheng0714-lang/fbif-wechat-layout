name: Deploy to server

on:
  push:
    branches: [main]
  workflow_dispatch:

# 生产只有一组 live 路径和单实例 JSON store；部署必须排队，绝不能并发 swap/rollback。
concurrency:
  group: fbifmp-layout-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # 只有 main 一个分支（2026-10-08 用户裁定），没有 PR 可以先考试：推 main 后先调用
  # P0 工作流跑完全部考试（红线 30），任何一项失败都不上线。
  p0:
    uses: ./.github/workflows/p0-monitoring-contract.yml

  # deploy job 只构建并事务上线：不得再装浏览器、不得再跑全量测试（考试在上面的 p0）。
  deploy:
    needs: [p0]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.11'
          cache-dependency-path: api/go.sum

      - name: Build API server
        run: |
          cd api
          GOOS=linux GOARCH=amd64 go build -o fbif-api .

      - name: Generate deploy version file
        run: |
          cat > public/version.json <<EOF
          {
            "build": "${GITHUB_SHA}",
            "commit": "${GITHUB_SHA}",
            "deployed_at": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          }
          EOF

      - name: Deploy transactionally
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
          HOST: ${{ secrets.SERVER_HOST }}
          USER: ${{ secrets.SERVER_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          LIBREOFFICE_URL: ${{ secrets.LIBREOFFICE_URL }}
          LIBREOFFICE_TOKEN: ${{ secrets.LIBREOFFICE_TOKEN }}
          RULE_SUPER_ADMIN_OPEN_IDS: ${{ secrets.RULE_SUPER_ADMIN_OPEN_IDS }}
          AUTH_SESSION_SECRET: ${{ secrets.AUTH_SESSION_SECRET }}
          FEISHU_LOGIN_APP_ID: ${{ secrets.FEISHU_LOGIN_APP_ID }}
        run: |
          set -Eeuo pipefail

          # 所有必需配置必须在任何远端 live 写入前 fail loud。只打印变量名，绝不打印值。
          # CLOUDCONVERT_API_KEY、FEISHU_LOGIN_APP_SECRET、PUBLISH_ADMIN_SERVICE_TOKEN、RENDER_TOKEN、SSO_TOKEN_KEY（飞书授权封存钥匙）
          # 由 FBIF 中台下发到服务器的 /etc/fbif-hub/env/layout.env、render.env，CI 不持有也不写；
          # 事务脚本 preflight 时查中台文件。
          for required in SSH_KEY KNOWN_HOSTS HOST USER DEPLOY_PATH RULE_SUPER_ADMIN_OPEN_IDS AUTH_SESSION_SECRET FEISHU_LOGIN_APP_ID; do
            if [ -z "${!required:-}" ]; then
              echo "Missing required deployment secret: ${required}" >&2
              exit 1
            fi
          done
          if [ "$DEPLOY_PATH" != "/var/www/wechat-layout" ]; then
            echo "DEPLOY_PATH must be exactly /var/www/wechat-layout" >&2
            exit 1
          fi

          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          if ! ssh-keygen -F "$HOST" -f ~/.ssh/known_hosts >/dev/null; then
            echo "SERVER_KNOWN_HOSTS does not contain SERVER_HOST" >&2
            exit 1
          fi
          # GitHub-hosted Runner 到生产机的 SSH 偶发卡在握手/半开连接。所有 ssh/rsync
          # 统一 fail-fast，防止尚未激活的 staging 无限占住串行部署队列。
          cat > ~/.ssh/config <<'EOF'
          Host *
            BatchMode yes
            ConnectTimeout 15
            ConnectionAttempts 3
            ServerAliveInterval 15
            ServerAliveCountMax 3
            TCPKeepAlive yes
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
            # 十几次 ssh/rsync 共用一条连接，省掉每次重新握手的几秒。
            ControlMaster auto
            ControlPath ~/.ssh/cm-%C
            ControlPersist 10m
          EOF
          chmod 600 ~/.ssh/config

          DEPLOY_ID="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_DIR="/var/www/.fbif-layout-releases/${DEPLOY_ID}"
          SITE_ORIGIN="https://fbifmp-layout.foodtalks.cn"

          remote_transaction() {
            local action=$1
            local remote_command
            printf -v remote_command 'sudo bash %q %q %q %q %q' \
              "${RELEASE_DIR}/deploy-transaction.sh" "$action" "$RELEASE_DIR" "$DEPLOY_PATH" "$DEPLOY_ID"
            ssh -i ~/.ssh/deploy_key "${USER}@${HOST}" "$remote_command"
          }

          cleanup_staging() {
            local remote_command
            printf -v remote_command 'sudo rm -rf -- %q' "$RELEASE_DIR"
            ssh -i ~/.ssh/deploy_key "${USER}@${HOST}" "$remote_command" >/dev/null 2>&1 || true
          }

          transaction_started=0
          release_accepted=0
          on_deploy_error() {
            local rc=${1:-$?}
            local rollback_failed=0
            # set -E 让 ERR trap 在 $(...) 里也触发。子 shell 只带着退出码出去，回滚只由主 shell 做
            # 一次；否则子 shell 先回滚并删掉 staging，主 shell 再回滚找不到事务脚本、误报 ROLLBACK FAILED。
            if [ "${BASH_SUBSHELL:-0}" -gt 0 ]; then
              exit "$rc"
            fi
            trap - ERR HUP INT TERM
            if [ "$release_accepted" -eq 1 ]; then
              echo "Release already accepted; refusing automatic rollback after workers may have resumed." >&2
              echo "Candidate and backup kept for forward recovery: /var/www/.fbif-layout-backups/${DEPLOY_ID}" >&2
              exit "$rc"
            fi
            if [ "$transaction_started" -eq 1 ]; then
              echo "Deployment verification failed; restoring previous release" >&2
              if ! remote_transaction rollback; then
                echo "ROLLBACK FAILED — inspect /var/www/.fbif-layout-backups/${DEPLOY_ID}" >&2
                rollback_failed=1
              fi
            fi
            if [ "$rollback_failed" -eq 0 ]; then
              cleanup_staging
            else
              echo "Staging kept at ${RELEASE_DIR} for manual recovery" >&2
            fi
            exit "$rc"
          }
          trap 'on_deploy_error $?' ERR
          trap 'on_deploy_error 129' HUP
          trap 'on_deploy_error 130' INT
          trap 'on_deploy_error 143' TERM

          # SSH / sudo / current-service preflight. Creating an isolated staging directory is
          # allowed here; no live static, binary, env, render or Caddy path has been touched.
          remote_setup_command='uid=$(id -u); gid=$(id -g); sudo rm -rf -- "$1"; sudo install -d -m 755 -o "$uid" -g "$gid" "$1" "$1/public" "$1/api" "$1/render" "$1/caddy" "$1/config" "$1/systemd"'
          ssh -i ~/.ssh/deploy_key "${USER}@${HOST}" bash -s -- "$RELEASE_DIR" <<<"$remote_setup_command"

          # Upload every artifact into the isolated release. render dependencies are resolved
          # from render-service/package-lock.json in staging, never inside the live directory.
          # 静态文件以线上目录为底（--copy-dest：在服务器上复制、只传差异，不碰线上文件）：GitHub 到主力服务器
          # 偶尔每秒只有十几 KB，17MB 的字体从头传会超 20 分钟被取消（2026-11-12）。
          rsync -avz \
            -e "ssh -i ~/.ssh/deploy_key" \
            --copy-dest="${DEPLOY_PATH}/" \
            public/ \
            "${USER}@${HOST}:${RELEASE_DIR}/public/"

          rsync -avz \
            -e "ssh -i ~/.ssh/deploy_key" \
            api/fbif-api \
            "${USER}@${HOST}:${RELEASE_DIR}/api/"

          rsync -avz --exclude=node_modules \
            -e "ssh -i ~/.ssh/deploy_key" \
            render-service/ \
            "${USER}@${HOST}:${RELEASE_DIR}/render/"

          rsync -avz \
            -e "ssh -i ~/.ssh/deploy_key" \
            deploy/caddy/fbifmp-layout.caddy \
            "${USER}@${HOST}:${RELEASE_DIR}/caddy/"

          rsync -avz \
            -e "ssh -i ~/.ssh/deploy_key" \
            deploy/config/ \
            "${USER}@${HOST}:${RELEASE_DIR}/config/"

          rsync -avz \
            -e "ssh -i ~/.ssh/deploy_key" \
            deploy/systemd/ \
            "${USER}@${HOST}:${RELEASE_DIR}/systemd/"

          rsync -avz \
            -e "ssh -i ~/.ssh/deploy_key" \
            deploy/scripts/deploy-transaction.sh \
            deploy/scripts/validate-env.py \
            "${USER}@${HOST}:${RELEASE_DIR}/"

          ssh -i ~/.ssh/deploy_key "${USER}@${HOST}" \
            "cd '$RELEASE_DIR/render' && npm ci --omit=dev --no-audit --no-fund"

          # publish.env 是手工维护的独立 EnvironmentFile，不在这里覆盖。中台下发的变量（上面 4 个和
          # publish.env 里原来的 6 个）只在中台文件里，systemd drop-in 让服务最后读它、同名为准。
          ENV_CONTENT=$(printf 'ENV=production\nFBIF_CONFIG_SCHEMA_VERSION=1\nLIBREOFFICE_URL=%s\nLIBREOFFICE_TOKEN=%s\nRULE_SUPER_ADMIN_OPEN_IDS=%s\nAUTH_SESSION_SECRET=%s\nAUTH_USERS_PATH=/var/www/api/data/auth-users.json\nFEISHU_LOGIN_APP_ID=%s\nFEISHU_LOGIN_REDIRECT_URI=https://fbifmp-layout.foodtalks.cn/auth/feishu/fbif/qr-callback\nPUBLIC_DIR=%s\nWECHAT_UPLOAD_ORIGIN=%s\nWECHAT_UPLOAD_ENDPOINT=http://127.0.0.1:9000/api/wechat-upload\nRENDER_SERVICE_URL=%s\nDEPLOYMENT_WRITES_PAUSED=1\n' "$LIBREOFFICE_URL" "$LIBREOFFICE_TOKEN" "$RULE_SUPER_ADMIN_OPEN_IDS" "$AUTH_SESSION_SECRET" "$FEISHU_LOGIN_APP_ID" "${DEPLOY_PATH}" "https://fbifmp-layout.foodtalks.cn" "http://127.0.0.1:19096" | base64 -w 0)
          printf -v env_stage_command 'umask 077; base64 -d > %q' "$RELEASE_DIR/api.env"
          printf '%s' "$ENV_CONTENT" | ssh -i ~/.ssh/deploy_key "${USER}@${HOST}" "$env_stage_command"
          # 渲染服务的 RENDER_TOKEN 由中台下发到 /etc/fbif-hub/env/render.env，这里不写。
          RENDER_ENV_CONTENT=$(printf 'FBIF_CONFIG_SCHEMA_VERSION=1\nNODE_ENV=production\nRENDER_PORT=19096\nPUBLIC_DIR=%s\nRULES_API_ORIGIN=http://127.0.0.1:9001\nASSET_ORIGIN=%s\nRENDER_BUILD_SHA=%s\n' "${DEPLOY_PATH}" "$SITE_ORIGIN" "$GITHUB_SHA" | base64 -w 0)
          printf -v render_env_stage_command 'umask 077; base64 -d > %q' "$RELEASE_DIR/render.env"
          printf '%s' "$RENDER_ENV_CONTENT" | ssh -i ~/.ssh/deploy_key "${USER}@${HOST}" "$render_env_stage_command"

          # preflight 再次确认候选 Caddy、lockfile 依赖、当前服务与本机健康；随后才允许
          # 事务脚本备份并激活 live 版本。
          remote_transaction preflight
          transaction_started=1
          remote_transaction activate

          # 公网验收也属于事务：版本 SHA、API 健康或鉴权边界任一不符，ERR trap 会回滚。
          health_json=$(curl --silent --show-error --fail --retry 12 --retry-delay 2 --retry-all-errors \
            "${SITE_ORIGIN}/api/health")
          echo "$health_json" | jq -e '.status == "ok"' >/dev/null

          version_json=$(curl --silent --show-error --fail --retry 12 --retry-delay 2 --retry-all-errors \
            "${SITE_ORIGIN}/version.json?deploy=${GITHUB_SHA}")
          echo "$version_json" | jq -e --arg sha "$GITHUB_SHA" '.commit == $sha and .build == $sha' >/dev/null

          # 图片转存要登录（2026-11-09 安全审计）：公网不登录、只带同源头必须 401，证明 Caddy 把它交给
          # Go 且 Origin/Referer 不能冒充登录。「Go → 本机上传服务」整条链路由事务脚本在服务器本机带
          # RENDER_TOKEN 调一次：非法 URL 上游记单图失败、返回空 results，不写 OSS；缺配置或上游不可达都阻止部署。
          upload_status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --header 'Content-Type: application/json' \
            --header "Origin: ${SITE_ORIGIN}" \
            --header "Referer: ${SITE_ORIGIN}/ft/ft-default" \
            --data '{"urls":["not-a-url"]}' \
            "${SITE_ORIGIN}/api/oss-upload")
          [ "$upload_status" = "401" ]
          image_upload_json=$(remote_transaction upload-probe)
          echo "$image_upload_json" | jq -e '.results | type == "object"' >/dev/null

          rules_status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            "${SITE_ORIGIN}/api/rules/admin/presets")
          [ "$rules_status" = "401" ]
          publish_status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            "${SITE_ORIGIN}/api/publish/jobs")
          [ "$publish_status" = "401" ]
          # 登录由入口统一拦截：没登录打开编辑器去登录；自己带 X-FBIF-User 冒充的，入口删掉、照样 401。
          page_login=$(curl --silent --show-error --output /dev/null --write-out '%{http_code} %{redirect_url}' \
            --header 'Sec-Fetch-Mode: navigate' --header 'Accept: text/html' "${SITE_ORIGIN}/mp/fbif")
          case "$page_login" in "302 ${SITE_ORIGIN}/auth/login?next="*) ;; *) echo "editor page did not redirect to login: $page_login"; exit 1 ;; esac
          forged_user=$(printf '{"id":"FJY632B9P3E:forged","name":"x","company_code":"FJY632B9P3E"}' | base64 | tr '+/' '-_' | tr -d '=\n')
          forged_status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --header 'Accept: application/json' --header "X-FBIF-User: ${forged_user}" "${SITE_ORIGIN}/api/auth/me")
          [ "$forged_status" = "401" ]
          feishu_status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --header 'Content-Type: application/json' --data '{}' \
            "${SITE_ORIGIN}/api/feishu/card-callback")
          [ "$feishu_status" = "404" ]
          # 排版接口的说明书和 OpenAPI 不用钥匙：验收新版 Go 路由经 Caddy 通到公网（排版程序 19098 的健康在事务里查过）。
          layout_openapi_json=$(curl --silent --show-error --fail --retry 3 --retry-delay 1 --retry-all-errors \
            "${SITE_ORIGIN}/api/layout/v1/openapi.json")
          echo "$layout_openapi_json" | jq -e '.openapi == "3.1.0" and (.paths | has("/api/layout/v1/render"))' >/dev/null

          # 管理员 readiness 要的服务令牌只在服务器的中台文件里：经 SSH 让事务脚本在本机读令牌、
          # 调 127.0.0.1:9001，标准输出只有响应 JSON。
          readiness_json=$(remote_transaction readiness)
          echo "$readiness_json" | jq -e '
            .ready == true and
            .config_schema.expected == "1" and
            .config_schema.actual == "1" and
            .config_schema.matches == true and
            .workers_paused == true and
            .store_valid == true and
            .generated_files.registry_present == true and
            .generated_files.registry_hash_matches == true and
            .generated_files.block_registry_present == true and
            .generated_files.block_registry_hash_matches == true and
            .service_auth.configured == true and
            .image_upload.configured == true and
            .http_review_enabled == false and
            .foodtalks.configured == true and
            .foodtalks.target_matches_expected == true and
            .foodtalks.front_explicit == true and
            .foodtalks.admin_explicit == true and
            .foodtalks.categories_explicit == true and
            .foodtalks.categories_valid == true and
            .render.configured == true and
            .feishu.notify_configured == true and
            .feishu.monitor_notify_configured == true and
            .feishu.callback_mode == "websocket" and
            .feishu.callback_mode_explicit == true and
            .feishu.callback_configured == true and
            .feishu.reviewer_allowlist_configured == true and
            .enrich_mode == "mimo"
          ' >/dev/null
          echo "Publish target: $(echo "$readiness_json" | jq -r '.foodtalks.target')"

          # 监控已迁往监控端（FoodTalks_Feed 的 fbif-link-watchdog）。这一步只把
          # 本机残留的旧 watchdog 单元与目录摘干净，幂等；失败仍可完整 rollback。
          remote_transaction prepare-monitoring

          # 到这里候选代码、静态资源、鉴权边界、运行配置和监控已验收。先关闭自动 rollback，
          # 再解除写暂停；worker 恢复后可能产生不可逆外部副作用，只允许前向修复。
          transaction_started=0
          release_accepted=1
          remote_transaction unpause

          unpaused_health=$(curl --silent --show-error --fail --retry 12 --retry-delay 2 --retry-all-errors \
            "${SITE_ORIGIN}/api/health")
          echo "$unpaused_health" | jq -e '.status == "ok"' >/dev/null
          unpaused_readiness=$(remote_transaction readiness)
          echo "$unpaused_readiness" | jq -e '
            .ready == true and
            .config_schema.matches == true and
            .workers_paused == false and
            .store_valid == true and
            .generated_files.registry_present == true and
            .generated_files.registry_hash_matches == true and
            .generated_files.block_registry_present == true and
            .generated_files.block_registry_hash_matches == true and
            .service_auth.configured == true and
            .http_review_enabled == false and
            .feishu.monitor_notify_configured == true and
            .feishu.reviewer_allowlist_configured == true and
            .enrich_mode == "mimo"
          ' >/dev/null

          remote_transaction finalize
          release_accepted=0
          trap - ERR HUP INT TERM
