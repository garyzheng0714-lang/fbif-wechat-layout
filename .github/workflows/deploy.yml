name: Deploy to server

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 测试门禁：任何测试失败都不允许部署（2026-07-10 架构体检修复：
      # 此前 CI 只编译不测试，1.3 万行测试形同虚设，测试挂了照样上生产）
      - name: Run JS tests (gate)
        run: |
          npm ci
          npm test

      - name: Run Go tests (gate)
        run: |
          cd api
          go test ./...

      - name: Build API server
        run: |
          cd api
          GOOS=linux GOARCH=amd64 go build -o fbif-api .

      - name: Generate deploy version file
        run: |
          cat > public/version.json <<EOF
          {
            "build": "${GITHUB_SHA}",
            "commit": "${GITHUB_SHA}",
            "deployed_at": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          }
          EOF

      - name: Deploy via rsync
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          HOST: ${{ secrets.SERVER_HOST }}
          USER: ${{ secrets.SERVER_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          LIBREOFFICE_URL: ${{ secrets.LIBREOFFICE_URL }}
          LIBREOFFICE_TOKEN: ${{ secrets.LIBREOFFICE_TOKEN }}
          CLOUDCONVERT_API_KEY: ${{ secrets.CLOUDCONVERT_API_KEY }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          RENDER_TOKEN: ${{ secrets.RENDER_TOKEN }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

          # Deploy static files
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            public/ \
            "${USER}@${HOST}:${DEPLOY_PATH}/"

          # Deploy API binary
          rsync -avz \
            -e "ssh -i ~/.ssh/deploy_key" \
            api/fbif-api \
            "${USER}@${HOST}:${DEPLOY_PATH}/../api/"

          # Deploy render service (Node headless renderer, systemd: fbif-render)
          rsync -avz --delete --exclude=node_modules \
            -e "ssh -i ~/.ssh/deploy_key" \
            render-service/ \
            "${USER}@${HOST}:/var/www/render-service/"

          # Render service deps (linkedom for footer DOM shim)
          ssh -i ~/.ssh/deploy_key "${USER}@${HOST}" \
            "cd /var/www/render-service && npm install --omit=dev --no-audit --no-fund"

          # S4(2026-07-10)：Caddy 路由声明式管理。本站 vhost 的唯一真相源是仓库的
          # deploy/caddy/fbifmp-layout.caddy，同步到 /etc/caddy/sites/ 后 validate；
          # 服务器主 Caddyfile（15 站共用）只保留一行 import，本项目不再注入式 patch
          # （旧 ~250 行注入脚本曾因同一路由问题连修 6 次）。validate 失败自动恢复
          # 上一版 vhost，坏配置永远到不了运行中的 Caddy。
          rsync -avz \
            -e "ssh -i ~/.ssh/deploy_key" \
            deploy/caddy/fbifmp-layout.caddy \
            "${USER}@${HOST}:/tmp/fbifmp-layout.caddy.new"
          ssh -i ~/.ssh/deploy_key "${USER}@${HOST}" "sudo bash -s" <<'CADDYSYNC'
          set -euo pipefail
          target=/etc/caddy/sites/fbifmp-layout.caddy
          mkdir -p /etc/caddy/sites
          if [ -f "$target" ]; then cp "$target" "$target.prev"; fi
          mv /tmp/fbifmp-layout.caddy.new "$target"
          if ! caddy validate --config /etc/caddy/Caddyfile; then
            echo "caddy validate failed — restoring previous vhost" >&2
            if [ -f "$target.prev" ]; then mv "$target.prev" "$target"; fi
            exit 1
          fi
          CADDYSYNC

          # Write env file for the fbif-api systemd service (loaded via EnvironmentFile=)
          # Tempfile + atomic rename so the service never sees a half-written file.
          # PUBLIC_DIR points the Go binary at the rsync target so /mp/* /ft/*
          # ServeFile lookups succeed even though the binary's cwd does not
          # contain a `public/` sibling. See README "Production layout".
          if [ -z "$ADMIN_PASSWORD" ]; then
            echo "ADMIN_PASSWORD GitHub secret is required for the rule admin backend" >&2
            exit 1
          fi
          if [ -z "$RENDER_TOKEN" ]; then
            echo "RENDER_TOKEN GitHub secret is required for the render API (/api/render)" >&2
            exit 1
          fi
          ENV_CONTENT=$(printf 'LIBREOFFICE_URL=%s\nLIBREOFFICE_TOKEN=%s\nCLOUDCONVERT_API_KEY=%s\nADMIN_PASSWORD=%s\nPUBLIC_DIR=%s\nWECHAT_UPLOAD_ORIGIN=%s\nRENDER_TOKEN=%s\nRENDER_SERVICE_URL=%s\n' "$LIBREOFFICE_URL" "$LIBREOFFICE_TOKEN" "$CLOUDCONVERT_API_KEY" "$ADMIN_PASSWORD" "${DEPLOY_PATH}" "https://fbifmp-layout.foodtalks.cn" "$RENDER_TOKEN" "http://127.0.0.1:19096" | base64)
          ssh -i ~/.ssh/deploy_key "${USER}@${HOST}" \
            "echo '$ENV_CONTENT' | base64 -d > /var/www/api/.env.tmp && chmod 600 /var/www/api/.env.tmp && mv /var/www/api/.env.tmp /var/www/api/.env"

          # Belt-and-suspenders: keep /var/www/public as a symlink to the
          # actual static deploy path so a binary started WITHOUT PUBLIC_DIR
          # (manual run, ad-hoc test) still finds app.html via the legacy
          # `../public` fallback in main.go.
          ssh -i ~/.ssh/deploy_key "${USER}@${HOST}" \
            "ln -snf '${DEPLOY_PATH}' /var/www/public"

          # Restart API service. Previously this line carried `2>/dev/null || true`
          # which swallowed real failures — a failed restart leaves the OLD
          # binary running and new mux routes return 404 in prod. Fail loudly
          # instead, and prove the service is active before the deploy declares
          # success.
          ssh -i ~/.ssh/deploy_key "${USER}@${HOST}" "sudo systemctl restart fbif-api && sudo systemctl is-active --quiet fbif-api && sudo systemctl status fbif-api --no-pager --lines=5"

          # Restart render service (same fail-loud contract as fbif-api above).
          ssh -i ~/.ssh/deploy_key "${USER}@${HOST}" "sudo systemctl restart fbif-render && sudo systemctl is-active --quiet fbif-render"

          ssh -i ~/.ssh/deploy_key "${USER}@${HOST}" \
            "sudo caddy validate --config /etc/caddy/Caddyfile && sudo systemctl reload caddy"
