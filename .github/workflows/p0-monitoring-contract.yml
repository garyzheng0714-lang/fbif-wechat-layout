name: P0 WeChat Monitoring Contract

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p0-monitoring-layout-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 外检看门狗已于 2026-08-06 迁往监控端 FoodTalks_Feed（fbif-link-watchdog），
  # 它的测试随之迁走。本仓库这一侧继续无 paths 过滤地守住加工链路的 P0 契约：
  # 幂等 intake、审核卡 outbox、监控不变量与告警转发。
  #
  # ⚠️ job 名 backend-and-watchdog 是 main 分支保护的必需检查（required status
  # check）之一，且 enforce_admins=true。改名会让那个检查永远不出现，PR 永久
  # BLOCKED 且管理员也合不了——要改名必须同步更新分支保护配置。名字里的
  # watchdog 已是历史，实际内容见上。
  backend-and-watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      # No path filter: every change must re-prove the idempotent intake,
      # review-card outbox, monitoring invariants and alert relay.
      - name: Run complete Go test suite
        working-directory: api
        run: go test ./...

      - name: Prove in-flight layout or review-card work cannot report green
        working-directory: api
        run: go test . -run 'TestPublishMonitoring(ReportsOnlyOperationalMetrics|GuardsReviewNotificationAndDeduplication)'

      - name: Race-test publishing contracts
        working-directory: api
        run: go test -race ./...

  frontend-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci
      - run: npm test

  browser-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run browser interaction tests
        run: E2E_PORT=19190 npm run test:e2e:ci
