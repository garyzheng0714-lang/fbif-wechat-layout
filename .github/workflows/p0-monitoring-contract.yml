name: P0 WeChat Monitoring Contract

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p0-monitoring-layout-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 外检看门狗已于 2026-08-06 迁往监控端 FoodTalks_Feed（fbif-link-watchdog），
  # 它的测试随之迁走。本仓库这一侧继续无 paths 过滤地守住加工链路的 P0 契约：
  # 幂等 intake、审核卡 outbox、监控不变量与告警转发。
  #
  # ⚠️ job 名 backend-and-watchdog 是 main 分支保护的必需检查（required status
  # check）之一，且 enforce_admins=true。改名会让那个检查永远不出现，PR 永久
  # BLOCKED 且管理员也合不了——要改名必须同步更新分支保护配置。名字里的
  # watchdog 已是历史，实际内容见上。
  backend-and-watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      # No path filter: every change must re-prove the idempotent intake,
      # review-card outbox, monitoring invariants and alert relay.
      - name: Go fmt, vet, staticcheck, test, race and vulns
        working-directory: api
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Go files need gofmt:" >&2
            echo "$unformatted" >&2
            exit 1
          fi
          go vet ./...
          go run honnef.co/go/tools/cmd/staticcheck@2026.1 ./...
          go test ./... -coverprofile=coverage.out
          coverage=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub(/%/, "", $3); print $3}')
          awk -v actual="$coverage" 'BEGIN { if (actual + 0 < 73) exit 1 }'
          go test -race ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

      - name: Shell, Python and env schema
        run: |
          shellcheck deploy/scripts/*.sh
          bash -n deploy/scripts/deploy-transaction.sh
          python3 -m py_compile deploy/scripts/validate-env.py
          python3 deploy/scripts/validate-env.py deploy/config/env-schema.json api_managed deploy/config/api.env.example
          python3 deploy/scripts/validate-env.py deploy/config/env-schema.json api_publish deploy/config/publish.env.example
          python3 deploy/scripts/validate-env.py deploy/config/env-schema.json render deploy/config/render.env.example

  frontend-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint:js
      - run: npm run test:coverage
      - run: npm run audit:deps

  browser-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      # 只装 Chrome。Firefox / WebKit 不进门禁，也不在部署机上装。
      - run: npx playwright install --with-deps chromium
      - name: Run browser interaction tests
        run: E2E_PORT=19190 npm run test:e2e:ci
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/e2e
            tests/e2e-screenshots
          if-no-files-found: ignore
          retention-days: 7
