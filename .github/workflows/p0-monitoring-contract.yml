name: P0 WeChat Monitoring Contract

on:
  pull_request:
  workflow_dispatch:
  # 只有 main 一个分支（2026-10-08 用户裁定），改动直接推 main：deploy.yml 先调用本
  # 工作流跑完全部考试，通过才上线。
  workflow_call:

permissions:
  contents: read

# 同一个 PR 连推只跑最新一次；main 上每个提交都要完整跑完，不取消。
concurrency:
  group: p0-monitoring-layout-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # 外检看门狗已于 2026-08-06 迁往监控端 FoodTalks_Feed（fbif-link-watchdog），
  # 它的测试随之迁走。本仓库这一侧继续无 paths 过滤地守住加工链路的 P0 契约：
  # 幂等 intake、审核卡 outbox、监控不变量与告警转发。
  #
  # ⚠️ job 名 backend-and-watchdog 是 main 分支保护的必需检查（required status
  # check）之一。2026-10-08 起只有 main 一个分支，管理员直接推 main（enforce_admins
  # 关闭），考试改由 deploy.yml 在上线前调用本工作流；改名须同步分支保护配置。名字里的
  # watchdog 已是历史，实际内容见上。
  backend-and-watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      # No path filter: every change must re-prove the idempotent intake,
      # review-card outbox, monitoring invariants and alert relay.
      # staticcheck 用官方预编译包（校验 sha256），不在现场编译。
      - name: Install staticcheck 2026.1
        run: |
          curl -fsSL -o /tmp/staticcheck.tar.gz \
            https://github.com/dominikh/go-tools/releases/download/2026.1/staticcheck_linux_amd64.tar.gz
          echo "9242b4bf5b9f5481fd720ec6d1018b38fbffe0e2730e498923c6e8053e8576be  /tmp/staticcheck.tar.gz" | sha256sum -c -
          tar -xzf /tmp/staticcheck.tar.gz -C /tmp
          echo /tmp/staticcheck >> "$GITHUB_PATH"

      # 覆盖率直接从 race 那一遍取：同一套测试只跑一遍，race 与覆盖率门槛都不降。
      - name: Go fmt, vet, staticcheck, race test with coverage, vulns
        working-directory: api
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Go files need gofmt:" >&2
            echo "$unformatted" >&2
            exit 1
          fi
          go vet ./...
          staticcheck ./...
          go test -race ./... -coverprofile=coverage.out
          coverage=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub(/%/, "", $3); print $3}')
          echo "Go coverage: ${coverage}%"
          awk -v actual="$coverage" 'BEGIN { if (actual + 0 < 73) exit 1 }'
          go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

      - name: Shell, Python and env schema
        run: |
          shellcheck deploy/scripts/*.sh
          bash -n deploy/scripts/deploy-transaction.sh
          python3 -m py_compile deploy/scripts/validate-env.py
          # 中台下发的变量只在中台文件里，示例同样叠上中台文件的示例再校验（和服务器上 preflight 一样）。
          python3 deploy/scripts/validate-env.py --overlay deploy/config/hub-layout.env.example deploy/config/env-schema.json api_managed deploy/config/api.env.example
          python3 deploy/scripts/validate-env.py --overlay deploy/config/hub-layout.env.example deploy/config/env-schema.json api_publish deploy/config/publish.env.example
          python3 deploy/scripts/validate-env.py --overlay deploy/config/hub-render.env.example deploy/config/env-schema.json render deploy/config/render.env.example

  frontend-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint:js
      - run: npm run test:coverage
      - run: npm run audit:deps

  browser-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # 门禁里的 webServer 用 go run 起 API：先装好带缓存的 Go，免得每次现场下载工具链、从零编译。
      - uses: actions/setup-go@v6
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      # 只装 Chrome。Firefox / WebKit 不进门禁，也不在部署机上装。
      - run: npx playwright install --with-deps chromium
      - name: Run browser interaction tests
        run: E2E_PORT=19190 npm run test:e2e:ci
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/e2e
            tests/e2e-screenshots
          if-no-files-found: ignore
          retention-days: 7
