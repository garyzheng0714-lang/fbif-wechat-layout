<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">FBIF 排版工具</title>
  <desc id="heroDesc">内容排版与受控发布工具：把 DOCX、Markdown、粘贴正文或文章链接转成适配微信公众号和 FoodTalks CMS 的 HTML。图中右侧是排版后的公众号文章样式，含蓝色署名行、浅灰图注和小节标题。</desc>

  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, "Cascadia Mono", monospace; }
    </style>
  </defs>

  <rect width="1200" height="400" rx="26" fill="#0F1115"/>

  <!-- 左：标题区 -->
  <g id="title-block" class="sans">
    <rect x="64" y="70" width="6" height="22" rx="3" fill="#396FBC"/>
    <text x="82" y="88" font-size="22" font-weight="600" fill="#6E9BE0" letter-spacing="1">公众号 / FoodTalks · 排版与受控发布</text>

    <text x="64" y="160" font-size="52" font-weight="700" fill="#FFFFFF" letter-spacing="1">FBIF 排版工具</text>

    <text x="64" y="210" font-size="24" fill="#98A2B3">DOCX、Markdown、粘贴正文或一条文章链接，</text>
    <text x="64" y="246" font-size="24" fill="#98A2B3">转成公众号和 FoodTalks 能直接用的 HTML。</text>

    <!-- 输入源 chips -->
    <g id="input-chips">
      <rect x="64" y="278" width="76" height="32" rx="8" fill="#1A1F27"/>
      <text x="102" y="300" font-size="17" class="mono" fill="#8FA0B8" text-anchor="middle">DOCX</text>

      <rect x="148" y="278" width="106" height="32" rx="8" fill="#1A1F27"/>
      <text x="201" y="300" font-size="17" class="mono" fill="#8FA0B8" text-anchor="middle">Markdown</text>

      <rect x="262" y="278" width="76" height="32" rx="8" fill="#1A1F27"/>
      <text x="300" y="300" font-size="17" fill="#8FA0B8" text-anchor="middle">链接</text>

      <rect x="346" y="278" width="76" height="32" rx="8" fill="#1A1F27"/>
      <text x="384" y="300" font-size="17" fill="#8FA0B8" text-anchor="middle">粘贴</text>
    </g>

    <text x="64" y="348" font-size="18" class="mono" fill="#5A6472">Go 1.26 · Vanilla JS · 生产使用中</text>
  </g>

  <!-- 右：排版后的公众号文章 -->
  <g id="article-preview" class="sans">
    <rect x="620" y="52" width="516" height="308" rx="12" fill="#FFFFFF"/>

    <text x="648" y="102" font-size="25" font-weight="700" fill="#1A1A1A">植物基不是终点：2026 食品创新</text>

    <text x="648" y="136" font-size="17" fill="#396FBC">FBIF食品饮料创新</text>
    <text x="798" y="136" font-size="17" fill="#9AA0A6">2026年5月30日</text>
    <line x1="648" y1="152" x2="1108" y2="152" stroke="#EDEFF2" stroke-width="1"/>

    <text x="648" y="182" font-size="17" fill="#3A3A3A">过去三年，「植物基」几乎成了食品创新的代名词。</text>
    <text x="648" y="208" font-size="17" fill="#3A3A3A">但当资本退潮、复购数据见底，行业开始追问：</text>

    <rect x="648" y="224" width="460" height="62" rx="4" fill="#EEF2F7"/>
    <text x="878" y="260" font-size="16" fill="#98A6B8" text-anchor="middle">配图 · 货架陈列</text>

    <text x="648" y="306" font-size="15" fill="#7F7F7F">图：某连锁超市的植物基专区，2026 年 4 月</text>

    <rect x="648" y="324" width="4" height="20" rx="2" fill="#396FBC"/>
    <text x="664" y="341" font-size="20" font-weight="700" fill="#1A1A1A">一、口感先行，叙事退后</text>
  </g>
</svg>
